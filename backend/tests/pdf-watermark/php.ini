; php.ini for the pinned Windows PHP runtime used by the PDF watermark tests.
; Copied next to php.exe inside .freebuff/pdf-watermark-tests/runtime/php/ by
; run.ps1. Never installed globally; system PHP is left untouched.

[PHP]
extension_dir = "ext"
error_reporting = E_ALL
display_errors = On
log_errors = Off
memory_limit = 512M
max_execution_time = 120
date.timezone = UTC
post_max_size = 64M
upload_max_filesize = 64M

; Required by the raster pipeline:
;   gd         - compositor (FreeType needed for imagettftext)
;   pdo_sqlite - in-memory test database for the authorization tests
extension=gd
extension=mbstring
extension=fileinfo
extension=exif
extension=openssl
extension=zip
extension=pdo_sqlite
extension=pdo_mysql
extension=sqlite3

[opcache]
opcache.enable_cli=0
