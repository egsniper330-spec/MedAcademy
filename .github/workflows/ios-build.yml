name: iOS Unsigned Build

# Triggers
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual iOS build'
  push:
    branches: [ main, release/* ]
    paths:
      - 'ios/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'patches/**'
  workflow_call:

# Concurrency - cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # iOS Build: unsigned IPA
  #
  # Pipeline:
  #   1. expo prebuild regenerates ios/ from app.json + config plugins
  #   2. CocoaPods install
  #   3. xcodebuild (CODE_SIGNING_ALLOWED=NO)
  #   4. Package .app into Payload/ zip -> .ipa
  #   5. Validate IPA >= 10 MB before uploading
  # ---------------------------------------------------------------------------
  ios-build:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      # Placeholder env-vars needed by Expo config plugins during prebuild only.
      # They do NOT affect the compiled binary.
      EXPO_PUBLIC_APP_ID: app-czyg340mpc75
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder

    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # 2. Node.js + pnpm dependencies
      # This project uses pnpm (pnpm-lock.yaml, lockfileVersion 9.0).
      # pnpm/action-setup installs a pinned pnpm version before setup-node so
      # that setup-node's caching integration works correctly.
      # pnpm 9.x is required for lockfileVersion 9.0 compatibility.
      # -------------------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Node dependencies
        # --frozen-lockfile: fail if pnpm-lock.yaml is out of sync with package.json
        # --ignore-scripts: skips postinstall (patch-package, sync-android-version)
        # which are not needed for an iOS build.
        run: pnpm install --frozen-lockfile --ignore-scripts

      # -------------------------------------------------------------------------
      # 3. Expo Prebuild (iOS only, clean)
      # Regenerates ios/ from app.json + config plugins.
      # --no-install skips pod install so we control it explicitly below.
      # -------------------------------------------------------------------------
      - name: Expo Prebuild (iOS, clean)
        run: npx expo prebuild --platform ios --clean --no-install

      # -------------------------------------------------------------------------
      # 4. Verify prebuild output
      # -------------------------------------------------------------------------
      - name: Verify prebuild output
        shell: bash
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "FAIL: No .xcworkspace found in ios/ after prebuild"
            ls -la ios/
            exit 1
          fi
          echo "OK: Xcode workspace: $WORKSPACE"

          SWIFT=$(find ios -name "IOSSecurityModule.swift" | head -1)
          OBJCM=$(find ios -name "IOSSecurityModule.m" | head -1)
          if [ -z "$SWIFT" ] || [ -z "$OBJCM" ]; then
            echo "FAIL: IOSSecurityModule files missing from ios/ - withSecurityModule plugin may have failed"
            exit 1
          fi
          echo "OK: IOSSecurityModule.swift: $SWIFT"
          echo "OK: IOSSecurityModule.m: $OBJCM"

          if grep -q 'buildReactNativeFromSource' ios/Podfile.properties.json 2>/dev/null; then
            echo "OK: buildReactNativeFromSource confirmed in Podfile.properties.json"
          else
            echo "WARN: ios.buildReactNativeFromSource not found in Podfile.properties.json"
            cat ios/Podfile.properties.json
          fi

      # -------------------------------------------------------------------------
      # 4b. Verify expo.jsEngine=jsc in Podfile.properties.json
      #
      # expo prebuild --clean regenerates Podfile.properties.json from app.json.
      # Confirm expo.jsEngine is "jsc" before patching. If this fails, app.json
      # ios.jsEngine is misconfigured — do not build.
      # -------------------------------------------------------------------------
      - name: Verify JSC engine in Podfile.properties.json
        shell: bash
        run: |
          PROPS="ios/Podfile.properties.json"
          if [ ! -f "$PROPS" ]; then
            echo "FAIL: $PROPS not found after prebuild"
            exit 1
          fi
          ENGINE=$(python3 -c "import json; d=json.load(open('$PROPS')); print(d.get('expo.jsEngine','(not set)'))")
          echo "expo.jsEngine = $ENGINE"
          if [ "$ENGINE" != "jsc" ]; then
            echo "FAIL: expo.jsEngine is '$ENGINE', expected 'jsc'."
            echo "      app.json must have: expo.ios.jsEngine = \"jsc\""
            cat "$PROPS"
            exit 1
          fi
          echo "OK: expo.jsEngine = jsc confirmed in Podfile.properties.json"

      # -------------------------------------------------------------------------
      # 5. Ruby + CocoaPods
      # -------------------------------------------------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install CocoaPods gem
        run: |
          gem install cocoapods --no-document
          pod --version

      # -------------------------------------------------------------------------
      # 5a. CocoaPods install
      #
      # USE_THIRD_PARTY_JSC=1 is set directly in this step's env block so it is
      # present in the same process that runs `pod install`. This tells
      # jsengine.rb (via the use_third_party_jsc() helper) to skip hermes-engine
      # and use the system JavaScriptCore instead.
      #
      # The permanent app configuration in app.json sets:
      #   expo.ios.jsEngine = "jsc"   → written to ios/Podfile.properties.json
      #                                 by expo prebuild (verified in step 4b above)
      # That property is read by the generated ios/Podfile at pod install time.
      # USE_THIRD_PARTY_JSC=1 ensures jsengine.rb honours the jsc selection.
      #
      # No ios/ files are permanently modified — ios/ is regenerated on every
      # expo prebuild --clean and must NOT be relied upon as a permanent fix.
      # -------------------------------------------------------------------------
      - name: CocoaPods install
        working-directory: ios
        env:
          USE_THIRD_PARTY_JSC: "1"
        shell: bash
        run: |
          set -euo pipefail

          echo "USE_THIRD_PARTY_JSC=${USE_THIRD_PARTY_JSC}"
          if [ "${USE_THIRD_PARTY_JSC}" != "1" ]; then
            echo "ERROR: USE_THIRD_PARTY_JSC is not set to 1 — aborting"
            exit 1
          fi

          echo "Running pod install..."
          pod install --repo-update 2>&1 | tee /tmp/pod-install.log
          POD_STATUS=${PIPESTATUS[0]}

          if [ "$POD_STATUS" -ne 0 ]; then
            echo "FAIL: pod install failed (exit $POD_STATUS)"
            tail -100 /tmp/pod-install.log || true
            exit "$POD_STATUS"
          fi

          echo "OK: pod install succeeded"

          if [ ! -d "Pods" ]; then
            echo "FAIL: Pods/ directory was not created"
            exit 1
          fi
          echo "OK: Pods/ directory present"

          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "FAIL: No .xcworkspace found after pod install"
            exit 1
          fi
          echo "OK: Xcode workspace present: $WORKSPACE"

          # ── Hard gate: hermes-engine pod must NOT be installed ────────────────
          if [ -d "Pods/hermes-engine" ]; then
            echo "FAIL: Pods/hermes-engine/ is present after pod install."
            echo "      USE_THIRD_PARTY_JSC=1 did not prevent hermes-engine."
            echo ""
            echo "--- Diagnostics ---"
            echo "USE_THIRD_PARTY_JSC : ${USE_THIRD_PARTY_JSC}"
            echo "expo.jsEngine from Podfile.properties.json:"
            python3 -c "import json; d=json.load(open('Podfile.properties.json')); print(d.get('expo.jsEngine','(not set)'))"
            echo "use_react_native! block in Podfile:"
            python3 -c "import re; t=open('Podfile').read(); m=re.search(r'use_react_native!\s*\(.*?\)', t, re.DOTALL); print(m.group(0) if m else '(block not found)')"
            echo "React Native version:"
            python3 -c "import json; d=json.load(open('../node_modules/react-native/package.json')); print(d.get('version','unknown'))" 2>/dev/null || echo "(unknown)"
            echo "Expo SDK version:"
            python3 -c "import json; d=json.load(open('../node_modules/expo/package.json')); print(d.get('version','unknown'))" 2>/dev/null || echo "(unknown)"
            echo "---"
            ls -la "Pods/hermes-engine/" | head -10
            exit 1
          fi
          echo "OK: Pods/hermes-engine is absent — JSC engine confirmed"

      # -------------------------------------------------------------------------
      # 5b. Patch fmt 11.0.2 for Apple Clang 21 (Xcode 26) consteval bug
      #
      # fmt 11.0.2 enables FMT_USE_CONSTEVAL for Apple Clang >= threshold that
      # includes Clang 21. Xcode 26 / Apple Clang 21 applies stricter consteval
      # rules and rejects fmt's FMT_STRING() calls in format-inl.h:
      #
      #   error: call to consteval function ... is not a constant expression
      #
      # Fix: force FMT_USE_CONSTEVAL 0 inside fmt/base.h AFTER pod install.
      # Patching base.h (not a compiler flag) is required because fmt/base.h
      # re-evaluates and overrides a bare -DFMT_USE_CONSTEVAL=0.
      #
      # ios/Podfile is regenerated by expo prebuild --clean on every run,
      # so this patch MUST live here in the workflow, not in the Podfile.
      #
      # The patch is idempotent (guarded by a sentinel comment).
      # -------------------------------------------------------------------------
      - name: Patch fmt consteval for Apple Clang 21 (Xcode 26)
        shell: bash
        run: |
          BASE_H="ios/Pods/fmt/include/fmt/base.h"
          SENTINEL="FMT_USE_CONSTEVAL_PATCHED_FOR_APPLE_CLANG_21"

          echo "=== fmt version from Podfile.lock ==="
          grep -i " fmt " ios/Podfile.lock 2>/dev/null \
            || grep -i " fmt " ios/Pods/Manifest.lock 2>/dev/null \
            || echo "(fmt version not found in lock files)"

          if [ ! -f "$BASE_H" ]; then
            echo "INFO: $BASE_H not found -- fmt not installed, skipping patch"
            exit 0
          fi

          echo "=== FMT_USE_CONSTEVAL lines before patch ==="
          grep -n "FMT_USE_CONSTEVAL" "$BASE_H" || true

          if grep -q "$SENTINEL" "$BASE_H"; then
            echo "OK: Patch already applied (sentinel found) -- skipping (idempotent)"
            exit 0
          fi

          PATCH_BLOCK='// FMT_USE_CONSTEVAL_PATCHED_FOR_APPLE_CLANG_21\n// Force-disable consteval for Apple Clang 21 (Xcode 26)\n#if defined(__apple_build_version__) && __apple_build_version__ >= 21000000\n#  undef  FMT_USE_CONSTEVAL\n#  define FMT_USE_CONSTEVAL 0\n#endif'

          # Make fmt/base.h writable before patching.
          # CocoaPods installs headers read-only; Python open(path,'w') raises
          # PermissionError: [Errno 13] Permission denied without this step.
          echo "=== File permissions before chmod ==="
          ls -la "$BASE_H"
          chmod u+w "$BASE_H"
          if [ ! -w "$BASE_H" ]; then
            echo "FAIL: $BASE_H is not writable after chmod u+w -- cannot patch"
            exit 1
          fi
          echo "OK: $BASE_H is writable"

          # Decode the base64-encoded Python patcher -- no heredoc needed,
          # 100% YAML-safe since the encoded string is a single quoted scalar.
          PATCHER=$(mktemp /tmp/fmt_patch_XXXXXX.py)
          echo '' | base64 --decode > "$PATCHER"

          python3 "$PATCHER" "$BASE_H" "$PATCH_BLOCK"
          PY_EXIT=$?
          rm -f "$PATCHER"

          if [ $PY_EXIT -ne 0 ]; then
            echo "WARN: patcher exited $PY_EXIT"
          fi

          echo ""
          echo "=== FMT_USE_CONSTEVAL lines after patch ==="
          grep -n "FMT_USE_CONSTEVAL" "$BASE_H" || true

          if grep -q "$SENTINEL" "$BASE_H"; then
            echo "OK: Patch confirmed applied"
          else
            echo "WARN: Sentinel not found after patch attempt"
          fi

      - name: Discover Xcode workspace and scheme
        id: xcode-info
        shell: bash
        run: |
          # ------------------------------------------------------------------
          # Step 1: Find the top-level CocoaPods workspace directly under ios/
          # (maxdepth 1 so we never pick up ios/*.xcodeproj/project.xcworkspace)
          # ------------------------------------------------------------------
          WORKSPACE=$(find ios -maxdepth 1 -type d -name "*.xcworkspace" | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "FAIL: No top-level .xcworkspace found directly under ios/"
            echo "      (CocoaPods must generate ios/<Name>.xcworkspace after pod install)"
            echo ""
            echo "All .xcworkspace paths found (for diagnosis):"
            find ios -maxdepth 3 -type d -name "*.xcworkspace" -print
            echo ""
            echo "All .xcodeproj paths found (for diagnosis):"
            find ios -maxdepth 2 -name "*.xcodeproj" -print
            exit 1
          fi

          echo "=== Selected workspace ==="
          echo "$WORKSPACE"

          # ------------------------------------------------------------------
          # Step 2: List all available schemes in the workspace
          # ------------------------------------------------------------------
          echo ""
          echo "=== Available schemes ==="
          SCHEMES_OUTPUT=$(xcodebuild -workspace "$WORKSPACE" -list 2>&1)
          echo "$SCHEMES_OUTPUT"

          # ------------------------------------------------------------------
          # Step 3: Determine the correct application scheme.
          # Priority order:
          #   a) A scheme whose name exactly matches the workspace basename
          #      (e.g. workspace = ios/MedAcademy.xcworkspace -> try "MedAcademy")
          #   b) The first scheme listed that is NOT "Pods" and NOT a test scheme
          # ------------------------------------------------------------------
          WORKSPACE_BASENAME=$(basename "$WORKSPACE" .xcworkspace)

          # Extract scheme names from xcodebuild -list output
          # Schemes appear after the "Schemes:" line, one per indented line
          ALL_SCHEMES=$(echo "$SCHEMES_OUTPUT" \
            | awk '/Schemes:/{found=1; next} found && /^[[:space:]]+[^[:space:]]/{print $1}')

          echo ""
          echo "Parsed scheme list:"
          echo "$ALL_SCHEMES"

          # a) Try exact match on workspace basename
          SCHEME=""
          if echo "$ALL_SCHEMES" | grep -qx "$WORKSPACE_BASENAME"; then
            SCHEME="$WORKSPACE_BASENAME"
            echo "Selected scheme (exact match): $SCHEME"
          fi

          # b) Fall back: first scheme that is not "Pods" and not a *Tests scheme
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$ALL_SCHEMES" \
              | grep -v "^Pods$" \
              | grep -v "Tests$" \
              | head -1)
            if [ -n "$SCHEME" ]; then
              echo "Selected scheme (first non-Pods/non-Tests): $SCHEME"
            fi
          fi

          if [ -z "$SCHEME" ]; then
            echo "FAIL: Could not determine a valid application scheme."
            echo "      Available schemes:"
            echo "$ALL_SCHEMES"
            exit 1
          fi

          # ------------------------------------------------------------------
          # Step 4: Hard-validate that the selected scheme actually exists
          # ------------------------------------------------------------------
          if ! echo "$ALL_SCHEMES" | grep -qx "$SCHEME"; then
            echo "FAIL: Selected scheme '$SCHEME' is not in the workspace scheme list."
            echo "      Available schemes:"
            echo "$ALL_SCHEMES"
            exit 1
          fi

          echo ""
          echo "=== Selected scheme ==="
          echo "$SCHEME"

          # ------------------------------------------------------------------
          # Step 5: Export outputs
          # ------------------------------------------------------------------
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # 7. xcodebuild (unsigned, Release)
      # CODE_SIGNING_ALLOWED=NO gives a compiled binary packageable as unsigned IPA.
      # PIPESTATUS[0] captures xcodebuild's real exit code from the tee pipeline.
      # Complete compiler diagnostics printed on failure (no tail truncation).
      # -------------------------------------------------------------------------
      - name: Build iOS app (unsigned, Release)
        id: xcode-build
        shell: bash
        run: |
          WORKSPACE="${{ steps.xcode-info.outputs.workspace }}"
          SCHEME="${{ steps.xcode-info.outputs.scheme }}"
          BUILD_DIR="$RUNNER_TEMP/ios-build"

          echo "Building workspace: $WORKSPACE"
          echo "Scheme:             $SCHEME"
          echo "Build dir:          $BUILD_DIR"

          # ------------------------------------------------------------------
          # Tool versions (for diagnosis)
          # ------------------------------------------------------------------
          echo ""
          echo "=== Tool versions ==="
          xcodebuild -version
          clang --version
          ruby --version
          pod --version

          # fmt version from CocoaPods lock file
          echo ""
          echo "=== fmt version ==="
          grep -i "fmt" ios/Podfile.lock 2>/dev/null \
            || grep -i "fmt" ios/Pods/Manifest.lock 2>/dev/null \
            || echo "(fmt not found in lock files)"

          # ------------------------------------------------------------------
          # Build
          # ------------------------------------------------------------------
          echo ""
          echo "=== Starting xcodebuild ==="
          set -o pipefail

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            GCC_OPTIMIZATION_LEVEL=0 \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            build \
            2>&1 | tee /tmp/xcodebuild.log

          BUILD_EXIT=${PIPESTATUS[0]}

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "================================================================"
            echo "BUILD FAILED (exit $BUILD_EXIT) -- compiler diagnostics below"
            echo "================================================================"

            echo ""
            echo "=== COMPILER ERRORS (error: / fatal error: / clang: error: / FAILED) ==="
            grep -n -E "error:|fatal error:|clang: error:|: FAILED$" /tmp/xcodebuild.log \
              | tail -150 || true

            echo ""
            echo "=== fmt COMPILATION CONTEXT (format.cc +/-50 lines) ==="
            grep -n -B 30 -A 50 "Pods/fmt/src/format.cc" /tmp/xcodebuild.log \
              | tail -300 || true

            echo ""
            echo "=== Folly / React Native C++ CONTEXT ==="
            grep -n -E "Folly|RCT|folly|hermes" /tmp/xcodebuild.log \
              | grep -E "error:|fatal error:" | tail -50 || true

            echo ""
            echo "=== LAST 300 LINES of build log ==="
            tail -300 /tmp/xcodebuild.log

            exit "$BUILD_EXIT"
          fi

          echo "OK: xcodebuild succeeded"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # 8. Locate built .app bundle
      # xcodebuild places the .app at:
      #   <derivedDataPath>/Build/Products/Release-iphoneos/<Name>.app
      # -------------------------------------------------------------------------
      - name: Locate built .app bundle
        id: locate-app
        shell: bash
        run: |
          BUILD_DIR="${{ steps.xcode-build.outputs.build_dir }}"

          echo "Searching for .app in: $BUILD_DIR"
          APP_PATH=$(find "$BUILD_DIR/Build/Products" \
            -name "*.app" \
            -not -name "*.app.dSYM" \
            -maxdepth 3 \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "FAIL: No .app bundle found under $BUILD_DIR/Build/Products"
            echo "Contents of Build/Products:"
            find "$BUILD_DIR/Build/Products" -maxdepth 3 | head -40 || echo "(empty)"
            exit 1
          fi
          echo "OK: Found .app at: $APP_PATH"

          APP_NAME=$(basename "$APP_PATH" .app)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # 9. Validate .app bundle integrity
      # -------------------------------------------------------------------------
      - name: Validate .app bundle integrity
        shell: bash
        run: |
          APP_PATH="${{ steps.locate-app.outputs.app_path }}"
          APP_NAME="${{ steps.locate-app.outputs.app_name }}"

          echo "=== Validating: $APP_PATH ==="

          if [ ! -d "$APP_PATH" ]; then
            echo "FAIL: $APP_PATH is not a directory"
            exit 1
          fi
          echo "OK: .app is a directory"

          EXEC_PATH="$APP_PATH/$APP_NAME"
          if [ ! -f "$EXEC_PATH" ]; then
            echo "FAIL: Executable not found at: $EXEC_PATH"
            ls -la "$APP_PATH" | head -30
            exit 1
          fi
          EXEC_SIZE=$(stat -f%z "$EXEC_PATH" 2>/dev/null || stat -c%s "$EXEC_PATH")
          echo "OK: Executable found: $EXEC_PATH ($EXEC_SIZE bytes)"

          # ── Mach-O binary format check ──────────────────────────────────────
          # Verify the executable is a real Mach-O binary (not a stub, script,
          # or empty placeholder) by inspecting the file type reported by `file`.
          FILE_TYPE=$(file "$EXEC_PATH")
          echo "    file(1) output: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qiE "Mach-O"; then
            echo "FAIL: Executable is not a Mach-O binary -- incomplete or corrupt build"
            echo "      Expected 'Mach-O' in file(1) output, got: $FILE_TYPE"
            exit 1
          fi
          echo "OK: Executable is a valid Mach-O binary"

          # ── Architecture check (arm64 required for iOS device builds) ───────
          # lipo -info prints the architecture list for the binary.
          # A Release-iphoneos build must contain arm64.
          LIPO_INFO=$(lipo -info "$EXEC_PATH" 2>&1)
          echo "    lipo -info output: $LIPO_INFO"
          if ! echo "$LIPO_INFO" | grep -q "arm64"; then
            echo "FAIL: arm64 slice not found in executable -- wrong SDK or incomplete build"
            echo "      lipo -info reported: $LIPO_INFO"
            exit 1
          fi
          echo "OK: arm64 architecture confirmed"

          PLIST="$APP_PATH/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "FAIL: Info.plist not found in .app"
            exit 1
          fi
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$PLIST" 2>/dev/null || true)
          BUNDLE_VER=$(plutil -extract CFBundleShortVersionString raw "$PLIST" 2>/dev/null || true)
          echo "OK: Info.plist present"
          echo "    CFBundleIdentifier:         $BUNDLE_ID"
          echo "    CFBundleShortVersionString: $BUNDLE_VER"

          if [ -z "$BUNDLE_ID" ]; then
            echo "FAIL: CFBundleIdentifier is empty -- corrupted Info.plist or wrong build"
            exit 1
          fi
          echo "OK: Bundle ID confirmed: $BUNDLE_ID"

          if [ -d "$APP_PATH/Frameworks" ]; then
            FW_COUNT=$(find "$APP_PATH/Frameworks" -name "*.framework" -maxdepth 1 | wc -l | tr -d ' ')
            echo "OK: Frameworks/ present with $FW_COUNT framework(s)"
          else
            echo "WARN: No Frameworks/ directory (may be OK for fully-static build)"
          fi

          echo "--- .app bundle summary ---"
          du -sh "$APP_PATH"
          ls -la "$APP_PATH" | head -20

      # -------------------------------------------------------------------------
      # 10. Package into unsigned IPA
      # Standard IPA structure: a ZIP archive containing Payload/<AppName>.app/
      # -------------------------------------------------------------------------
      - name: Create unsigned IPA
        id: create-ipa
        shell: bash
        run: |
          APP_PATH="${{ steps.locate-app.outputs.app_path }}"
          APP_NAME="${{ steps.locate-app.outputs.app_name }}"
          IPA_DIR="$RUNNER_TEMP/ipa-staging"
          IPA_PATH="$RUNNER_TEMP/${APP_NAME}-unsigned.ipa"

          echo "=== Creating unsigned IPA ==="
          echo "Source .app: $APP_PATH"
          echo "Output IPA:  $IPA_PATH"

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"

          # Copy entire .app into Payload/ preserving symlinks
          cp -a "$APP_PATH" "$IPA_DIR/Payload/${APP_NAME}.app"
          echo "OK: Payload/ directory created"
          ls -la "$IPA_DIR/Payload/"

          cd "$IPA_DIR"
          zip -r "$IPA_PATH" Payload/ --symlinks
          ZIP_EXIT=$?
          if [ "$ZIP_EXIT" -ne 0 ]; then
            echo "FAIL: zip failed (exit $ZIP_EXIT)"
            exit "$ZIP_EXIT"
          fi
          echo "OK: zip completed successfully"

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # 11. Validate IPA -- hard gate before upload
      # Fails the workflow if IPA is not a real archive >= 10 MB.
      # -------------------------------------------------------------------------
      - name: Validate IPA (hard gate before upload)
        shell: bash
        run: |
          IPA_PATH="${{ steps.create-ipa.outputs.ipa_path }}"
          APP_NAME="${{ steps.create-ipa.outputs.app_name }}"

          echo "=== IPA Validation ==="
          echo "Path: $IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            echo "FAIL: IPA file does not exist at: $IPA_PATH"
            exit 1
          fi
          echo "OK: IPA file exists"

          if ! unzip -t "$IPA_PATH" > /dev/null 2>&1; then
            echo "FAIL: IPA is NOT a valid ZIP archive"
            file "$IPA_PATH"
            hexdump -C "$IPA_PATH" | head -4
            exit 1
          fi
          echo "OK: IPA is a valid ZIP archive"

          if ! unzip -l "$IPA_PATH" | grep -q "Payload/${APP_NAME}.app/"; then
            echo "FAIL: IPA does not contain Payload/${APP_NAME}.app/"
            echo "--- IPA contents (first 30 entries) ---"
            unzip -l "$IPA_PATH" | head -30
            exit 1
          fi
          echo "OK: IPA contains Payload/${APP_NAME}.app/"

          if unzip -l "$IPA_PATH" | grep -q "Payload/${APP_NAME}.app/${APP_NAME}$"; then
            echo "OK: Executable present in IPA"
          else
            echo "WARN: Executable not listed by exact name -- may still be valid"
          fi

          # Hard size gate: must be >= 10 MB
          IPA_SIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")
          IPA_SIZE_MB=$(echo "scale=2; $IPA_SIZE / 1048576" | bc)
          echo "--- IPA size: $IPA_SIZE bytes (${IPA_SIZE_MB} MB) ---"

          MIN_BYTES=10485760
          if [ "$IPA_SIZE" -lt "$MIN_BYTES" ]; then
            echo "FAIL: IPA is too small: $IPA_SIZE bytes (${IPA_SIZE_MB} MB) -- must be >= 10 MB"
            echo "      This indicates a broken build, wrong path, placeholder, or empty archive."
            echo "--- IPA contents ---"
            unzip -l "$IPA_PATH" | head -40
            exit 1
          fi
          echo "OK: IPA size is acceptable: $IPA_SIZE bytes (${IPA_SIZE_MB} MB)"

          echo "--- IPA contents (first 40 entries) ---"
          unzip -l "$IPA_PATH" | head -40

          # ── Hard gate: hermesvm.framework must NOT be in the IPA ─────────────
          # hermesvm.framework is embedded under Payload/<App>.app/Frameworks/
          # If it is present, the iOS JS engine is still Hermes and the app will
          # crash on iOS 26 with EXC_BAD_ACCESS in HadesGC / ObjCTurboModule.
          # This is the final binary-level confirmation that JSC is active.
          if unzip -l "$IPA_PATH" | grep -q "hermesvm.framework"; then
            echo ""
            echo "================================================================"
            echo "FAIL: hermesvm.framework is present in the IPA."
            echo "      The iOS JS engine is still Hermes."
            echo "      withIosJsc plugin did not set hermes_enabled => false,"
            echo "      or hermesvm.framework was linked despite JSC configuration."
            echo "      Hermes entries found:"
            unzip -l "$IPA_PATH" | grep -i "hermes"
            echo "================================================================"
            exit 1
          fi
          echo "OK: hermesvm.framework is ABSENT from IPA — JSC engine confirmed"

          echo "OK: All IPA validations passed -- proceeding to upload"

      # -------------------------------------------------------------------------
      # 12. Upload IPA artifact
      # -------------------------------------------------------------------------
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MedAcademy-unsigned-IPA
          path: ${{ steps.create-ipa.outputs.ipa_path }}
          retention-days: 14
          if-no-files-found: error

      # -------------------------------------------------------------------------
      # 13. Upload build logs on failure
      # -------------------------------------------------------------------------
      - name: Upload Xcode build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            /tmp/xcodebuild.log
            /tmp/xcodebuild-raw.log
            /tmp/pod-install.log
          retention-days: 7
          if-no-files-found: ignore

      # -------------------------------------------------------------------------
      # 14. Build summary
      # -------------------------------------------------------------------------
      - name: Build summary
        if: success()
        shell: bash
        run: |
          IPA_PATH="${{ steps.create-ipa.outputs.ipa_path }}"
          APP_NAME="${{ steps.create-ipa.outputs.app_name }}"
          IPA_SIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")
          IPA_SIZE_MB=$(echo "scale=2; $IPA_SIZE / 1048576" | bc)
          echo "================================================"
          echo "iOS Build Completed Successfully"
          echo "App:      $APP_NAME"
          echo "IPA size: ${IPA_SIZE_MB} MB"
          echo "Artifact: MedAcademy-unsigned-IPA"
          echo "================================================"
