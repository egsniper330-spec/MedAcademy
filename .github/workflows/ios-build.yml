            # and this pattern occurs only once in this method (confirmed in source).
            # We use Python for reliable multi-line replacement.
            python3 - "$MM" <<'PYEOF'
          import sys

          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()

          old = (
              '- (JSRuntimeFactoryRef)createJSRuntimeFactory\n'
              '{\n'
              '#if USE_THIRD_PARTY_JSC != 1\n'
              '  return jsrt_create_hermes_factory();\n'
              '#endif\n'
              '}'
          )
          new = (
              '- (JSRuntimeFactoryRef)createJSRuntimeFactory\n'
              '{\n'
              '#if USE_THIRD_PARTY_JSC != 1\n'
              '  return jsrt_create_hermes_factory();\n'
              '#endif\n'
              '  return NULL; // jsc-null-fallback\n'
              '}'
