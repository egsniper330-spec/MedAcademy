      #
      #   error: non-void function does not return a value [-Werror,-Wreturn-type]
      #   File: Libraries/AppDelegate/RCTDefaultReactNativeFactoryDelegate.mm:49
      #
      # FIX:
      #   Add 'return NULL;' after the #endif so the method always returns.
      #   JSRuntimeFactoryRef is typedef void* — NULL is a valid sentinel value.
      #   The Swift override in AppDelegate.swift (Step 5a-v) means this ObjC base
      #   method is NEVER called at runtime when USE_THIRD_PARTY_JSC=1; the NULL
      #   return only satisfies -Werror=return-type at compile time.
      #
      #   RESULT after patch:
      #     - (JSRuntimeFactoryRef)createJSRuntimeFactory
      #     {
      #     #if USE_THIRD_PARTY_JSC != 1
      #       return jsrt_create_hermes_factory();
      #     #endif
      #       return NULL;    ← added: satisfies -Werror=return-type; never reached
      #     }
      #
      # SCOPE:
      #   This patches node_modules (transient on CI — fresh checkout each run).
      #   The patch is idempotent: sentinel 'return NULL; // jsc-null-fallback'
      #   prevents double-application if the step somehow runs twice.
      # -------------------------------------------------------------------------
      - name: Patch RCTDefaultReactNativeFactoryDelegate.mm — add NULL return for JSC path
        shell: bash
        run: |
          set -euo pipefail

          MM=$(find node_modules -path "*/Libraries/AppDelegate/RCTDefaultReactNativeFactoryDelegate.mm" \
               -not -path "*/node_modules/*/node_modules/*" 2>/dev/null | head -1)

          if [ -z "$MM" ]; then
