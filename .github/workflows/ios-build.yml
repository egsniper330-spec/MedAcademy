          if count != 2:
              print(f"ERROR: expected exactly 2 occurrences of pattern, found {count}")
              for i, line in enumerate(content.split('\n')[139:185], 140):
                  print(f"  {i}: {repr(line)}")
              sys.exit(1)

          content = content.replace(OLD, NEW)  # replaces all 2 occurrences

          with open(path, 'w') as f:
              f.write(content)

          print(f"Patch applied to {count} occurrences.")
          PYEOF

            echo ""
            echo "--- AFTER patch (lines 146-157 and 172-183) ---"
            sed -n '146,157p' "$MM"
            echo "---"
            sed -n '172,183p' "$MM"
          fi

          echo ""
          echo "=== Validation ==="

          COUNT=$(grep -cF 'return nullptr; // jsc-nullptr-fallback' "$MM" || true)
          if [ "$COUNT" -ne 2 ]; then
            echo "FAIL: expected 2 nullptr fallbacks, found $COUNT"
            exit 1
          fi
          echo "PASS: exactly 2 'return nullptr; // jsc-nullptr-fallback' present"

          COUNT=$(grep -cF 'return std::make_unique<facebook::react::HermesExecutorFactory>' "$MM" || true)
          if [ "$COUNT" -ne 2 ]; then
            echo "FAIL: Hermes returns altered — expected 2, found $COUNT"
            exit 1
          fi
          echo "PASS: both Hermes returns still present and guarded by #if USE_THIRD_PARTY_JSC != 1"

          echo "OK: RCTAppSetupUtils.mm patched — nullptr added for USE_THIRD_PARTY_JSC=1 path"

      # -------------------------------------------------------------------------
      # 5a-vii. Patch RCTDefaultReactNativeFactoryDelegate.mm: add NULL fallback return
      #
      # ROOT CAUSE (Build 11):
      #   USE_THIRD_PARTY_JSC=1 is now correctly propagated (v18 jsengine.rb fix).
      #   However, when USE_THIRD_PARTY_JSC=1, the method body is empty:
