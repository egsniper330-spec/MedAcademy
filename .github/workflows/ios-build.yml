name: iOS Unsigned Build

# Triggers
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual iOS build'
  push:
    branches: [ main, release/* ]
    paths:
      - 'ios/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'app.json'
      - 'package.json'
      - 'patches/**'
  workflow_call:

# Concurrency - cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # iOS Build: unsigned IPA
  #
  # Pipeline:
  #   1. expo prebuild regenerates ios/ from app.json + config plugins
  #   2. CocoaPods install
  #   3. xcodebuild (CODE_SIGNING_ALLOWED=NO)
  #   4. Package .app into Payload/ zip -> .ipa
  #   5. Validate IPA >= 10 MB before uploading
  # ---------------------------------------------------------------------------
  ios-build:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      # EXPO_PUBLIC_* vars are baked into the Metro JS bundle at xcodebuild time —
      # NOT just at prebuild time.  The placeholder values used previously were
      # embedded into the bundle and caused assertMeDoBlocked() to throw at runtime
      # (black screen on first launch).
      #
      # All three are now pulled from GitHub Secrets so the real project credentials
      # are available during Metro bundling (which runs inside xcodebuild, step 7).
      #
      # Required GitHub Secrets (Settings → Secrets → Actions):
      #   EXPO_PUBLIC_SUPABASE_URL      = https://xdvjwfuqipatkpimejcb.supabase.co
      #   EXPO_PUBLIC_SUPABASE_ANON_KEY = <project anon key>
      EXPO_PUBLIC_APP_ID: app-czyg340mpc75
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      # -------------------------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # 2. Node.js + npm dependencies
      # -------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        # npm ci installs exactly what is in package-lock.json.
        # --ignore-scripts skips postinstall (patch-package, sync-android-version)
        # which are not needed for an iOS build.
        run: npm ci --ignore-scripts

      # -------------------------------------------------------------------------
      # 2b. Validate required GitHub Secrets
      # Fail fast with an actionable message when Supabase credentials are absent.
      #
      # WHY THIS MATTERS (Black-Screen Root Cause):
      #   EXPO_PUBLIC_* variables are baked into the Metro JS bundle at xcodebuild
      #   time (not at prebuild time). If either secret is unset (empty string),
      #   the placeholder gets embedded into the bundle. At first launch:
      #     • medo-guard.ts assertMeDoBlocked() checks EXPO_PUBLIC_SUPABASE_URL.
      #     • If the URL is wrong/empty it throws synchronously during root-module
      #       evaluation — BEFORE any React component mounts → BLACK SCREEN.
      #   Catching this early prevents a confusing runtime failure with no visible
      #   error message on device.
      #
      # HOW TO FIX if this step fails:
      #   Repository → Settings → Secrets and variables → Actions → New secret:
      #     EXPO_PUBLIC_SUPABASE_URL      = https://xdvjwfuqipatkpimejcb.supabase.co
      #     EXPO_PUBLIC_SUPABASE_ANON_KEY = <your project anon key>
      # -------------------------------------------------------------------------
      - name: Validate required GitHub Secrets
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0

          if [ -z "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" ]; then
            echo "================================================================"
            echo "FAIL: Secret EXPO_PUBLIC_SUPABASE_URL is not set."
            echo ""
            echo "  This secret must contain the full Supabase project URL:"
            echo "    https://xdvjwfuqipatkpimejcb.supabase.co"
            echo ""
            echo "  Without it the Metro bundle bakes an empty SUPABASE_URL,"
            echo "  assertMeDoBlocked() throws at startup, and the app shows"
            echo "  a black screen with no visible error on device."
            echo ""
            echo "  Fix: Repository → Settings → Secrets and variables → Actions"
            echo "       Add secret: EXPO_PUBLIC_SUPABASE_URL"
            echo "================================================================"
            FAIL=1
          else
            echo "OK: EXPO_PUBLIC_SUPABASE_URL is set"
          fi

          if [ -z "${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "================================================================"
            echo "FAIL: Secret EXPO_PUBLIC_SUPABASE_ANON_KEY is not set."
            echo ""
            echo "  This secret must contain the anon/public key for project"
            echo "  xdvjwfuqipatkpimejcb (found in Supabase Dashboard → API)."
            echo ""
            echo "  Fix: Repository → Settings → Secrets and variables → Actions"
            echo "       Add secret: EXPO_PUBLIC_SUPABASE_ANON_KEY"
            echo "================================================================"
            FAIL=1
          else
            echo "OK: EXPO_PUBLIC_SUPABASE_ANON_KEY is set"
          fi

          # Validate that the URL contains the expected project ref so a copy-paste
          # error (e.g. old project URL) is caught immediately rather than at runtime.
          SUPABASE_URL="${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}"
          EXPECTED_REF="xdvjwfuqipatkpimejcb"
          if [ -n "$SUPABASE_URL" ] && ! echo "$SUPABASE_URL" | grep -q "$EXPECTED_REF"; then
            echo "================================================================"
            echo "FAIL: EXPO_PUBLIC_SUPABASE_URL does not contain the expected"
            echo "      project reference: $EXPECTED_REF"
            echo ""
            echo "  Configured URL: $SUPABASE_URL"
            echo "  Expected URL:   https://$EXPECTED_REF.supabase.co"
            echo ""
            echo "  assertMeDoBlocked() will throw at runtime if the URL is wrong."
            echo "================================================================"
            FAIL=1
          elif [ -n "$SUPABASE_URL" ]; then
            echo "OK: EXPO_PUBLIC_SUPABASE_URL contains expected project ref ($EXPECTED_REF)"
          fi

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "One or more required secrets are missing or invalid."
            echo "Add them in: Repository → Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo ""
          echo "All required secrets are present and valid."

      # -------------------------------------------------------------------------
      # 3. Expo Prebuild (iOS only, clean)
      # Regenerates ios/ from app.json + config plugins.
      # --no-install skips pod install so we control it explicitly below.
      # -------------------------------------------------------------------------
      - name: Expo Prebuild (iOS, clean)
        run: npx expo prebuild --platform ios --clean --no-install

      # -------------------------------------------------------------------------
      # 4. Verify prebuild output
      # -------------------------------------------------------------------------
      - name: Verify prebuild output
        shell: bash
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -maxdepth 2 | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "FAIL: No .xcworkspace found in ios/ after prebuild"
            ls -la ios/
            exit 1
          fi
          echo "OK: Xcode workspace: $WORKSPACE"

          SWIFT=$(find ios -name "IOSSecurityModule.swift" | head -1)
          OBJCM=$(find ios -name "IOSSecurityModule.m" | head -1)
          if [ -z "$SWIFT" ] || [ -z "$OBJCM" ]; then
            echo "FAIL: IOSSecurityModule files missing from ios/ - withSecurityModule plugin may have failed"
            exit 1
          fi
          echo "OK: IOSSecurityModule.swift: $SWIFT"
          echo "OK: IOSSecurityModule.m: $OBJCM"

          if grep -q 'buildReactNativeFromSource' ios/Podfile.properties.json 2>/dev/null; then
            echo "OK: buildReactNativeFromSource confirmed in Podfile.properties.json"
          else
            echo "WARN: ios.buildReactNativeFromSource not found in Podfile.properties.json"
            cat ios/Podfile.properties.json
          fi

      # -------------------------------------------------------------------------
      # 4b. Verify expo.jsEngine=jsc in Podfile.properties.json
      #
      # expo prebuild --clean regenerates Podfile.properties.json from app.json.
      # Confirm expo.jsEngine is "jsc" before patching. If this fails, app.json
      # ios.jsEngine is misconfigured — do not build.
      # -------------------------------------------------------------------------
      - name: Verify JSC engine in Podfile.properties.json
        shell: bash
        run: |
          PROPS="ios/Podfile.properties.json"
          if [ ! -f "$PROPS" ]; then
            echo "FAIL: $PROPS not found after prebuild"
            exit 1
          fi
          ENGINE=$(python3 -c "import json; d=json.load(open('$PROPS')); print(d.get('expo.jsEngine','(not set)'))")
          echo "expo.jsEngine = $ENGINE"
          if [ "$ENGINE" != "jsc" ]; then
            echo "FAIL: expo.jsEngine is '$ENGINE', expected 'jsc'."
            echo "      app.json must have: expo.ios.jsEngine = \"jsc\""
            cat "$PROPS"
            exit 1
          fi
          echo "OK: expo.jsEngine = jsc confirmed in Podfile.properties.json"

      # -------------------------------------------------------------------------
      # 5. Ruby + CocoaPods
      # -------------------------------------------------------------------------
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install CocoaPods gem
        run: |
          gem install cocoapods --no-document
          pod --version

      # -------------------------------------------------------------------------
      # 5a. Patch react_native_pods.rb to honour USE_THIRD_PARTY_JSC
      #
      # ROOT CAUSE (React Native 0.83.x — all patch versions, confirmed by diff):
      #
      #   react_native_pods.rb line 78:
      #     hermes_enabled= true   ← unconditional, ignores :hermes_enabled param
      #
      #   line 158:  if hermes_enabled → setup_hermes!(...)   ← installs hermes-engine pod
      #   line 186:  setup_bridgeless!(..., :use_hermes => hermes_enabled)
      #              → adds React-RuntimeHermes pod
      #              → React-RuntimeHermes.podspec has unconditional hermes-engine dep
      #
      # use_react_native!() uses the LOCAL variable `hermes_enabled` (always true),
      # NOT the use_hermes() helper from jsengine.rb (which correctly returns false
      # when USE_THIRD_PARTY_JSC=1).  So even with USE_THIRD_PARTY_JSC=1,
      # setup_hermes! fires and hermes-engine is installed.
      #
      # THE FIX: patch the two lines in react_native_pods.rb so they consult
      # use_third_party_jsc() before invoking hermes setup.  This is a targeted
      # 2-line sed patch to node_modules/ — NOT to ios/.  node_modules/ is
      # populated by `npm ci` on every CI run, so the patch is re-applied every
      # build.  ios/ is never touched.
      #
      # PATCH LINES (idempotent — sed only replaces when the original text matches):
      #   L158:  if hermes_enabled
      #          → if hermes_enabled && !use_third_party_jsc()
      #   L186:  setup_bridgeless!(:react_native_path => prefix, :use_hermes => hermes_enabled)
      #          → setup_bridgeless!(:react_native_path => prefix, :use_hermes => hermes_enabled && !use_third_party_jsc())
      # -------------------------------------------------------------------------
      - name: Patch react_native_pods.rb for JSC support
        shell: bash
        run: |
          set -euo pipefail

          RN_PODS="node_modules/react-native/scripts/react_native_pods.rb"

          if [ ! -f "$RN_PODS" ]; then
            echo "FAIL: $RN_PODS not found — npm ci may not have run"
            exit 1
          fi

          echo "--- react_native_pods.rb BEFORE patch (hermes lines) ---"
          grep -n "if hermes_enabled\|setup_bridgeless" "$RN_PODS"

          # Patch L158: gate setup_hermes! on use_third_party_jsc() check.
          # sed matches exact original text; if already patched the line won't match → idempotent.
          sed -i '' \
            's/^  if hermes_enabled$/  if hermes_enabled \&\& !use_third_party_jsc()/' \
            "$RN_PODS"

          # Patch L186: gate setup_bridgeless! use_hermes arg on same check.
          sed -i '' \
            's/:use_hermes => hermes_enabled)$/:use_hermes => hermes_enabled \&\& !use_third_party_jsc())/' \
            "$RN_PODS"

          echo "--- react_native_pods.rb AFTER patch (hermes lines) ---"
          grep -n "if hermes_enabled\|setup_bridgeless" "$RN_PODS"

          # Verify both patches landed.
          if ! grep -q "if hermes_enabled && !use_third_party_jsc()" "$RN_PODS"; then
            echo "FAIL: L158 patch did not apply"
            exit 1
          fi
          if ! grep -q ":use_hermes => hermes_enabled && !use_third_party_jsc()" "$RN_PODS"; then
            echo "FAIL: L186 patch did not apply"
            exit 1
          fi
          echo "OK: react_native_pods.rb patched successfully"

      # -------------------------------------------------------------------------
      # 5a-ii. Patch jsengine.rb: fix flag string to prevent macro concatenation
      #
      # ROOT CAUSE (Build 7 — React-RCTAppDelegate compile error):
      #   fatal error: 'reacthermes/HermesExecutorFactory.h' file not found
      #   Target: React-RCTAppDelegate
      #   File: RCTAppSetupUtils.h line 16-17
      #
      # The condition in RCTAppSetupUtils.h:
      #   #if USE_THIRD_PARTY_JSC != 1
      #   #import <reacthermes/HermesExecutorFactory.h>
      #
      # The compiler invocation "visibly" contained -DUSE_THIRD_PARTY_JSC=1
      # yet the preprocessor still reached the Hermes #import. Here is why:
      #
      # React-RCTAppDelegate.podspec line 21:
      #   other_cflags = "$(inherited) " + new_arch_enabled_flag + js_engine_flags()
      #
      # where:
      #   new_arch_enabled_flag = " -DRCT_NEW_ARCH_ENABLED=1"  (leading space, no trailing)
      #   js_engine_flags()     = "-DUSE_THIRD_PARTY_JSC=1 -DUSE_HERMES=0"  (no leading space)
      #
      # String concatenation WITHOUT a separating space produces:
      #   "$(inherited)  -DRCT_NEW_ARCH_ENABLED=1-DUSE_THIRD_PARTY_JSC=1 -DUSE_HERMES=0"
      #
      # Clang splits on whitespace, yielding three tokens:
      #   $(inherited)
      #   -DRCT_NEW_ARCH_ENABLED=1-DUSE_THIRD_PARTY_JSC=1   ← ONE malformed token
      #   -DUSE_HERMES=0
      #
      # Clang interprets -DRCT_NEW_ARCH_ENABLED=1-DUSE_THIRD_PARTY_JSC=1 as:
      #   #define RCT_NEW_ARCH_ENABLED  1-DUSE_THIRD_PARTY_JSC=1   (garbage value)
      # USE_THIRD_PARTY_JSC is NEVER defined as an independent macro.
      #
      # With USE_THIRD_PARTY_JSC undefined (treated as 0):
      #   #if USE_THIRD_PARTY_JSC != 1  →  0 != 1  →  TRUE  →  Hermes included
      #   → 'reacthermes/HermesExecutorFactory.h' file not found (hermes absent)
      #
      # (The -DUSE_HERMES=0 token IS properly separated and reaches Clang correctly,
      # which is why the RCTCxxBridge.mm guard works — but RCTAppSetupUtils.h uses
      # USE_THIRD_PARTY_JSC, not USE_HERMES, so it still fires.)
      #
      # THE FIX: add a LEADING SPACE to use_third_party_jsc_flags() return value:
      #   return " -DUSE_THIRD_PARTY_JSC=1 -DUSE_HERMES=0"
      #             ^^ leading space ^^
      #
      # Resulting concatenation:
      #   "$(inherited) " + " -DRCT_NEW_ARCH_ENABLED=1" + " -DUSE_THIRD_PARTY_JSC=1 -DUSE_HERMES=0"
      # = "$(inherited)  -DRCT_NEW_ARCH_ENABLED=1 -DUSE_THIRD_PARTY_JSC=1 -DUSE_HERMES=0"
      #
      # Tokens: $(inherited), -DRCT_NEW_ARCH_ENABLED=1, -DUSE_THIRD_PARTY_JSC=1, -DUSE_HERMES=0
      # All four tokens correctly separated. USE_THIRD_PARTY_JSC = 1 properly defined.
      # RCTAppSetupUtils.h: USE_THIRD_PARTY_JSC != 1 → 1 != 1 → FALSE → Hermes NOT included ✓
      # -------------------------------------------------------------------------
      - name: Patch jsengine.rb for JSC support
        shell: bash
        run: |
          set -euo pipefail

          JSENGINE="node_modules/react-native/scripts/cocoapods/jsengine.rb"

          if [ ! -f "$JSENGINE" ]; then
            echo "FAIL: $JSENGINE not found — npm ci may not have run"
            exit 1
          fi

          echo "--- jsengine.rb BEFORE patch ---"
          grep -n "use_third_party_jsc_flags\|USE_HERMES\|USE_THIRD_PARTY_JSC" "$JSENGINE"

          # Patch: use_third_party_jsc_flags() must return BOTH flags WITH a leading
          # space so that string-concatenation in React-RCTAppDelegate.podspec:
          #   other_cflags = "$(inherited) " + new_arch_enabled_flag + js_engine_flags()
          # produces properly space-separated tokens on the Clang command line.
          # Without the leading space, -DRCT_NEW_ARCH_ENABLED=1 and -DUSE_THIRD_PARTY_JSC=1
          # are fused into one malformed token and USE_THIRD_PARTY_JSC is never defined.
          # Idempotent: if already patched the original string won't match.
          sed -i '' \
            's/return "-DUSE_THIRD_PARTY_JSC=1"/return " -DUSE_THIRD_PARTY_JSC=1 -DUSE_HERMES=0"/' \
            "$JSENGINE"

          echo "--- jsengine.rb AFTER patch ---"
          grep -n "use_third_party_jsc_flags\|USE_HERMES\|USE_THIRD_PARTY_JSC" "$JSENGINE"

          if ! grep -q 'return " -DUSE_THIRD_PARTY_JSC=1 -DUSE_HERMES=0"' "$JSENGINE"; then
            echo "FAIL: jsengine.rb patch did not apply"
            exit 1
          fi
          echo "OK: jsengine.rb patched successfully"

      # -------------------------------------------------------------------------
      # -------------------------------------------------------------------------
      # 5a-iii. Patch EXJavaScriptRuntime.mm: guard hermes import + include
      #         JSCRuntime.h in the #else (JSC) branch
      #
      # TWO bugs are fixed by this patch:
      #
      # BUG 1 — bare unconditional hermes import (line 10):
      #   Original:   #import <hermes/hermes.h>
      #   Problem:    When hermes-engine pod is absent (JSC build), this header
      #               does not exist → fatal error: 'hermes/hermes.h' file not found.
      #   Fix:        Wrap in __has_include guard.
      #
      # BUG 2 — missing JSCRuntime.h include in #else branch:
      #   EXJavaScriptRuntime.mm line ~41 (inside the existing #else block):
      #     _runtime = jsc::makeJSCRuntime();
      #   'jsc' is an abbreviated alias for the namespace 'facebook::jsc'.
      #   EXJavaScriptRuntime.h defines:
      #     namespace jsi = facebook::jsi;
      #     namespace react = facebook::react;
      #   but DOES NOT define:
      #     namespace jsc = facebook::jsc;
      #   JSCRuntime.h (from React-jsc/@react-native-community/javascriptcore)
      #   declares makeJSCRuntime() inside namespace facebook::jsc — but this
      #   header is NEVER included by the original file or any of its imports.
      #   Without JSCRuntime.h, the compiler sees 'jsc' as undeclared.
      #   Build 6 confirmed: pod install succeeded (HEADER_SEARCH_PATHS for
      #   $(PODS_ROOT)/Headers/Public/React-jsc is now a proper -I path thanks
      #   to step 5a-iv), but the compile still failed with:
      #     error: use of undeclared identifier 'jsc'; did you mean 'jsi'?
      #   because JSCRuntime.h was never included to bring in the namespace.
      #
      # THE COMPLETE FIX:
      #   Replace:
      #     #import <hermes/hermes.h>          ← bare, unconditional
      #   With:
      #     #if __has_include(<reacthermes/HermesExecutorFactory.h>)
      #     #import <hermes/hermes.h>          ← Hermes build: include hermes
      #     #else
      #     #include <JSCRuntime.h>            ← JSC build: include JSCRuntime.h
      #     namespace jsc = facebook::jsc;    ← alias so jsc::makeJSCRuntime()
      #     #endif                               resolves (mirrors jsi/react aliases
      #                                          already in EXJavaScriptRuntime.h)
      #
      # WHY #include <JSCRuntime.h> works now (build 6 onwards):
      #   Step 5a-iv patches ios/Podfile to add
      #   $(PODS_ROOT)/Headers/Public/React-jsc to ExpoModulesJSI's
      #   HEADER_SEARCH_PATHS as a real -I path (not just a headermap entry).
      #   CocoaPods installs React-jsc's headers (from common/JSCRuntime.h)
      #   to $(PODS_ROOT)/Headers/Public/React-jsc/JSCRuntime.h.
      #   So <JSCRuntime.h> resolves correctly with angle brackets.
      #
      # WHY namespace jsc = facebook::jsc is needed:
      #   The call site uses bare 'jsc::makeJSCRuntime()' not 'facebook::jsc::'.
      #   JSCRuntime.h only defines the full namespace — no alias is provided.
      #   EXJavaScriptRuntime.h provides aliases for jsi and react but not jsc.
      #   Adding the alias here mirrors the existing pattern and avoids modifying
      #   EXJavaScriptRuntime.h (which would require a larger patch).
      #
      # IDEMPOTENCY: sentinel = the #if guard line immediately followed by the
      #   hermes import. This sequence does NOT exist in the unpatched file
      #   (line 26 has __has_include but is followed by the Hermes factory call,
      #   not the hermes.h import). Once patched, re-running detects the sentinel
      #   and skips.
      #
      # SCOPE: only EXJavaScriptRuntime.mm in node_modules/expo-modules-core.
      #   Transient — does not persist across expo prebuild --clean runs.
      # -------------------------------------------------------------------------
      - name: Patch EXJavaScriptRuntime.mm for JSC support
        shell: bash
        run: |
          set -euo pipefail

          EXJSRT="node_modules/expo-modules-core/ios/JSI/EXJavaScriptRuntime.mm"

          if [ ! -f "$EXJSRT" ]; then
            echo "FAIL: $EXJSRT not found"
            exit 1
          fi

          echo "--- EXJavaScriptRuntime.mm BEFORE patch (lines 8-14) ---"
          sed -n '8,14p' "$EXJSRT"

          python3 - "$EXJSRT" <<'PYEOF'
          import sys

          path = sys.argv[1]

          # The bare unconditional top-level hermes import to replace
          target = '#import <hermes/hermes.h>\n'

          # Full replacement:
          #   - Guards the hermes import for Hermes builds
          #   - Adds JSCRuntime.h include for JSC builds (brings facebook::jsc namespace)
          #   - Adds namespace jsc = facebook::jsc alias (mirrors jsi/react aliases
          #     already in EXJavaScriptRuntime.h; needed because call site uses jsc::
          #     not facebook::jsc::)
          replacement = (
              '#if __has_include(<reacthermes/HermesExecutorFactory.h>)\n'
              '#import <hermes/hermes.h>\n'
              '#else\n'
              '#include <JSCRuntime.h>\n'
              'namespace jsc = facebook::jsc;\n'
              '#endif\n'
          )

          with open(path, 'r') as f:
              content = f.read()

          # Idempotent sentinel: the #if guard line immediately before the hermes
          # import. This sequence does NOT appear in the unpatched file — line 26
          # of the unpatched file has the same __has_include but is followed by
          # makeHermesRuntime(), not the import. Once patched, the sentinel is
          # present and the patch is skipped on re-runs.
          sentinel = (
              '#if __has_include(<reacthermes/HermesExecutorFactory.h>)\n'
              '#import <hermes/hermes.h>\n'
          )
          if sentinel in content:
              print("Already patched — skipping.")
              sys.exit(0)

          if target not in content:
              print(f"ERROR: target line '{target.strip()}' not found in {path}")
              sys.exit(1)

          new_content = content.replace(target, replacement, 1)
          with open(path, 'w') as f:
              f.write(new_content)

          print("Patch applied successfully.")
          PYEOF

          echo "--- EXJavaScriptRuntime.mm AFTER patch (lines 8-17) ---"
          sed -n '8,17p' "$EXJSRT"

          # Verify all three elements are present
          if ! grep -qF '#if __has_include(<reacthermes/HermesExecutorFactory.h>)' "$EXJSRT"; then
            echo "FAIL: hermes guard not found"
            exit 1
          fi
          if ! grep -qF '#include <JSCRuntime.h>' "$EXJSRT"; then
            echo "FAIL: JSCRuntime.h include not found"
            exit 1
          fi
          if ! grep -qF 'namespace jsc = facebook::jsc;' "$EXJSRT"; then
            echo "FAIL: namespace jsc alias not found"
            exit 1
          fi
          echo "OK: EXJavaScriptRuntime.mm patched — hermes guarded, JSCRuntime.h included, jsc alias added"

      # -------------------------------------------------------------------------
      # 5a-iv. Patch ios/Podfile: inject ExpoModulesJSI HEADER_SEARCH_PATHS fix
      #        INSIDE the existing post_install hook (not a second hook)
      #
      # ROOT CAUSE — 'JSCRuntime.h' file not found with <angled> include:
      #
      #   EXJavaScriptRuntime.mm #else branch calls jsc::makeJSCRuntime(), declared
      #   in JSCRuntime.h (from @react-native-community/javascriptcore).
      #   React-jsc.podspec installs this header to:
      #     ios/Pods/Headers/Public/React-jsc/JSCRuntime.h
      #   CocoaPods exposes it to ExpoModulesJSI via headermap (double-quote access
      #   only). Angle-bracket #include <JSCRuntime.h> requires the directory to be
      #   in a proper -I search path, which CocoaPods does NOT add automatically
      #   for transitive headermap dependencies.
      #
      # THE FIX: Inside the existing post_install block in ios/Podfile, add Ruby
      #   code to find the ExpoModulesJSI target and append
      #   $(PODS_ROOT)/Headers/Public/React-jsc to its HEADER_SEARCH_PATHS.
      #   This becomes a proper -I flag so #include <JSCRuntime.h> resolves.
      #
      # WHY INJECT INSIDE (not append a second block):
      #   CocoaPods does not allow multiple post_install blocks — adding a second
      #   one causes "Specifying multiple post_install hooks is unsupported."
      #   The generated Podfile already has exactly one post_install block from
      #   expo prebuild. This step injects BEFORE its closing 'end' (the inner
      #   'end' that closes the post_install block, not the outer 'end' that
      #   closes the 'target' block).
      #
      # INJECTION POINT: The generated Podfile looks like:
      #   target 'MedAcademy' do
      #     ...
      #     post_install do |installer|
      #       react_native_post_install(...)
      #     end          ← inner end (closes post_install) — inject BEFORE this
      #   end            ← outer end (closes target block)
      #
      #   We locate the LAST occurrence of a line that is exactly '  end' (2-space
      #   indent, closes post_install) before the final 'end' (closes target).
      #   Concretely: we find the closing pattern of the post_install block and
      #   insert our Ruby snippet before it.
      #
      # SCOPE: ExpoModulesJSI target only. No other targets are modified.
      # PERMANENCE: ios/Podfile is regenerated by expo prebuild --clean on every
      #   run. This patch is re-applied transiently in each CI run. ✓
      # -------------------------------------------------------------------------
      - name: Patch Podfile — inject ExpoModulesJSI HEADER_SEARCH_PATHS into existing post_install
        shell: bash
        run: |
          set -euo pipefail

          PODFILE="ios/Podfile"

          if [ ! -f "$PODFILE" ]; then
            echo "FAIL: $PODFILE not found — expo prebuild must have run first"
            exit 1
          fi

          echo "--- Podfile BEFORE patch ---"
          cat -n "$PODFILE"

          python3 - "$PODFILE" <<'PYEOF'
          import sys, re

          path = sys.argv[1]

          # Idempotent sentinel — unique string that only appears after patching
          sentinel = '# JSC-fix: ExpoModulesJSI HEADER_SEARCH_PATHS'

          with open(path, 'r') as f:
              content = f.read()

          if sentinel in content:
              print("Already patched — skipping.")
              sys.exit(0)

          # Verify exactly one post_install block exists
          hook_count = content.count('post_install do |installer|')
          if hook_count == 0:
              print("ERROR: No 'post_install do |installer|' block found in Podfile")
              sys.exit(1)
          if hook_count > 1:
              print(f"ERROR: Found {hook_count} post_install blocks — expected exactly 1")
              sys.exit(1)

          # The Ruby snippet to inject inside the post_install block.
          # Targets ExpoModulesJSI only. Appends to existing HEADER_SEARCH_PATHS.
          # Uses 4-space indent to match the interior of the post_install block.
          snippet = (
              '    # JSC-fix: ExpoModulesJSI HEADER_SEARCH_PATHS\n'
              '    # Adds $(PODS_ROOT)/Headers/Public/React-jsc as an angle-bracket\n'
              '    # accessible -I path so #include <JSCRuntime.h> resolves.\n'
              '    installer.pods_project.targets.each do |target|\n'
              '      if target.name == \'ExpoModulesJSI\'\n'
              '        target.build_configurations.each do |config|\n'
              '          existing = config.build_settings[\'HEADER_SEARCH_PATHS\'] || \'$(inherited)\'\n'
              '          config.build_settings[\'HEADER_SEARCH_PATHS\'] = [\n'
              '            existing,\n'
              '            \'"$(PODS_ROOT)/Headers/Public/React-jsc"\'\n'
              '          ].join(\' \')\n'
              '        end\n'
              '      end\n'
              '    end\n'
          )

          # Locate the closing 'end' of the post_install block.
          # The generated Podfile structure is:
          #   post_install do |installer|\n
          #     react_native_post_install(...)\n
          #   end\n         ← this closes post_install (2-space indent)
          # end             ← this closes target block (0-space indent)
          #
          # Strategy: find 'post_install do |installer|', then find the first
          # line that is exactly '  end' (2-space indent) after it. That is the
          # closing 'end' of the post_install block. Inject our snippet before it.
          lines = content.split('\n')
          post_install_idx = None
          for i, line in enumerate(lines):
              if 'post_install do |installer|' in line:
                  post_install_idx = i
                  break

          if post_install_idx is None:
              print("ERROR: Could not locate post_install block start")
              sys.exit(1)

          # Find the first '  end' line after post_install_idx
          close_idx = None
          for i in range(post_install_idx + 1, len(lines)):
              stripped = lines[i].rstrip()
              if stripped == '  end':
                  close_idx = i
                  break

          if close_idx is None:
              print("ERROR: Could not locate closing 'end' of post_install block")
              sys.exit(1)

          print(f"post_install block at line {post_install_idx+1}, closes at line {close_idx+1}")

          # Insert snippet lines before close_idx
          snippet_lines = snippet.rstrip('\n').split('\n')
          new_lines = lines[:close_idx] + snippet_lines + lines[close_idx:]
          new_content = '\n'.join(new_lines)

          with open(path, 'w') as f:
              f.write(new_content)

          print("Patch applied successfully.")
          PYEOF

          echo ""
          echo "--- Podfile AFTER patch ---"
          cat -n "$PODFILE"

          echo ""
          echo "=== Validation ==="

          # 1. Exactly one post_install hook
          COUNT=$(grep -c 'post_install do |installer|' "$PODFILE" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: Expected 1 post_install block, found $COUNT"
            exit 1
          fi
          echo "PASS: Exactly 1 post_install block"

          # 2. ExpoModulesJSI patch present
          if ! grep -q 'ExpoModulesJSI' "$PODFILE"; then
            echo "FAIL: ExpoModulesJSI injection not found"
            exit 1
          fi
          echo "PASS: ExpoModulesJSI injection present"

          # 3. React-jsc header path present
          if ! grep -q 'React-jsc' "$PODFILE"; then
            echo "FAIL: React-jsc header path not found"
            exit 1
          fi
          echo "PASS: React-jsc header path present"

          # 4. No duplicate sentinel
          DUP=$(grep -c 'JSC-fix: ExpoModulesJSI HEADER_SEARCH_PATHS' "$PODFILE" || true)
          if [ "$DUP" -ne 1 ]; then
            echo "FAIL: Sentinel appears $DUP times (expected 1)"
            exit 1
          fi
          echo "PASS: Sentinel appears exactly once (no duplicates)"

          echo "OK: Podfile patched — ExpoModulesJSI will receive React-jsc HEADER_SEARCH_PATHS"

      # -------------------------------------------------------------------------
      # 5a-vi. Patch RCTAppSetupUtils.h: guard Hermes import with USE_HERMES
      #
      # ROOT CAUSE (Build 13):
      #   RCTAppSetupUtils.h line 16 has:
      #     #if USE_THIRD_PARTY_JSC != 1
      #     #import <reacthermes/HermesExecutorFactory.h>
      #     #endif
      #
      #   The Expo pod's compile command (ExpoReactNativeFactory.mm,
      #   EXReactRootViewFactory.mm — target 'Expo' from Pods) uses a shared
      #   response file (common-args.resp) that does NOT include -DUSE_THIRD_PARTY_JSC.
      #   When USE_THIRD_PARTY_JSC is undefined, the preprocessor evaluates
      #   'undefined != 1' → true → imports the Hermes header → fatal error:
      #     'reacthermes/HermesExecutorFactory.h' file not found
      #   (hermes-engine is intentionally absent in this JSC build).
      #
      #   The -DUSE_HERMES=0 flag IS present in common-args.resp and is therefore
      #   reliably available to ALL compilation units including the Expo pod.
      #
      # FIX:
      #   Replace the USE_THIRD_PARTY_JSC guard with a USE_HERMES guard:
      #     #if !defined(USE_HERMES) || USE_HERMES == 1  // jsc-hermes-header-guard
      #     #import <reacthermes/HermesExecutorFactory.h>
      #     #endif
      #
      #   This correctly skips the Hermes import whenever USE_HERMES=0,
      #   regardless of whether USE_THIRD_PARTY_JSC is defined.
      #
      #   Hermes build (USE_HERMES=1): condition true → header imported (unchanged)
      #   JSC build   (USE_HERMES=0): condition false → header not imported (fixed)
      #   Unknown     (USE_HERMES undefined): defaults to true → safe fallback
      #
      # NO OTHER DECLARATIONS in RCTAppSetupUtils.h depend on the Hermes header;
      # the header only provides HermesExecutorFactory used in .mm, not in .h.
      #
      # IDEMPOTENCY: sentinel 'jsc-hermes-header-guard' — skip if already patched.
      # SCOPE: node_modules only — transient, never committed.
      # -------------------------------------------------------------------------
      - name: Patch RCTAppSetupUtils.h — remove unconditional HermesExecutorFactory import
        shell: bash
        run: |
          set -euo pipefail

          # ROOT CAUSE (Build 14):
          #   RCTAppSetupUtils.h line 16-18 is:
          #     #if USE_THIRD_PARTY_JSC != 1
          #     #import <reacthermes/HermesExecutorFactory.h>
          #     #endif
          #
          #   The previous v25 fix replaced the condition with USE_HERMES.
          #   That works for the React-RCTAppDelegate pod which receives
          #   -DUSE_HERMES=0. But ~120 other pods (ExpoAudio, ExpoModulesCore,
          #   etc.) include this header via the umbrella and receive NO
          #   USE_HERMES flag at all, so !defined(USE_HERMES) is true and
          #   the import is still active — same fatal error.
          #
          # CORRECT FIX:
          #   Remove all 3 lines entirely. HermesExecutorFactory.h is NOT
          #   needed by the header itself — all declarations use only
          #   facebook::react::JSExecutorFactory which comes from
          #   <jsireact/JSIExecutor.h> (line 21). The Hermes import was
          #   only ever needed by RCTAppSetupUtils.mm, not by the header.
          #   Removing it is safe regardless of JSC or Hermes mode.
          #
          # IDEMPOTENCY: sentinel 'jsc-removed-hermes-import'

          H=$(find node_modules -path "*/Libraries/AppDelegate/RCTAppSetupUtils.h" \
               -not -path "*/node_modules/*/node_modules/*" 2>/dev/null | head -1)

          if [ -z "$H" ]; then
            echo "FAIL: RCTAppSetupUtils.h not found in node_modules"
            exit 1
          fi
          echo "Found: $H"

          echo "--- BEFORE patch (lines 14-20) ---"
          sed -n '14,20p' "$H"

          if grep -qF 'jsc-removed-hermes-import' "$H"; then
            echo "Already patched — skipping."
          else
            # Write the patch script to a temp file using printf.
            # Removes the 3-line block:
            #   #if USE_THIRD_PARTY_JSC != 1
            #   #import <reacthermes/HermesExecutorFactory.h>
            #   #endif
            # and inserts a one-line sentinel comment in its place.
            PATCH_PY=$(mktemp /tmp/patch_rct_h_XXXXXX.py)
            printf 'import sys\n' > "$PATCH_PY"
            printf 'path = sys.argv[1]\n' >> "$PATCH_PY"
            printf 'content = open(path).read()\n' >> "$PATCH_PY"
            printf 'block = "#if USE_THIRD_PARTY_JSC != 1\\n#import <reacthermes/HermesExecutorFactory.h>\\n#endif\\n"\n' >> "$PATCH_PY"
            printf 'sentinel = "// jsc-removed-hermes-import\\n"\n' >> "$PATCH_PY"
            printf 'if block not in content:\n' >> "$PATCH_PY"
            printf '    print("FAIL: 3-line Hermes block not found in " + path); sys.exit(1)\n' >> "$PATCH_PY"
            printf 'count = content.count(block)\n' >> "$PATCH_PY"
            printf 'if count != 1:\n' >> "$PATCH_PY"
            printf '    print(f"ERROR: expected 1 occurrence, found {count}"); sys.exit(1)\n' >> "$PATCH_PY"
            printf 'result = content.replace(block, sentinel, 1)\n' >> "$PATCH_PY"
            printf 'open(path,"w").write(result)\n' >> "$PATCH_PY"
            printf 'print("Patch applied.")\n' >> "$PATCH_PY"

            python3 "$PATCH_PY" "$H"
            rm -f "$PATCH_PY"

            echo "--- AFTER patch (lines 14-20) ---"
            sed -n '14,20p' "$H"
          fi

          echo ""
          echo "=== Hard validation — fail workflow if patch not effective ==="

          if ! grep -qF 'jsc-removed-hermes-import' "$H"; then
            echo "FAIL: sentinel 'jsc-removed-hermes-import' not present after patch"
            sed -n '14,20p' "$H"
            exit 1
          fi
          echo "PASS: sentinel 'jsc-removed-hermes-import' present"

          if grep -qF 'HermesExecutorFactory.h' "$H"; then
            echo "FAIL: HermesExecutorFactory.h import still present — patch did not remove it"
            grep -n 'HermesExecutorFactory' "$H"
            exit 1
          fi
          echo "PASS: HermesExecutorFactory.h import is gone"

          if grep -qF '#if USE_THIRD_PARTY_JSC' "$H"; then
            echo "FAIL: old USE_THIRD_PARTY_JSC guard still present — patch did not apply"
            exit 1
          fi
          echo "PASS: old USE_THIRD_PARTY_JSC guard removed"

          echo "--- Final header lines 14-20 ---"
          sed -n '14,20p' "$H"
          echo "OK: RCTAppSetupUtils.h patched — HermesExecutorFactory import removed"

      # -------------------------------------------------------------------------
      # 5a-vii. Patch RCTAppSetupUtils.mm: add nullptr return for USE_THIRD_PARTY_JSC=1
      #
      # ROOT CAUSE (Build 12):
      #   RCTAppSetupUtils.mm contains two functions:
      #     RCTAppSetupDefaultJsExecutorFactory(...)
      #     RCTAppSetupJsExecutorFactoryForOldArch(...)
      #   Both have the structure (inside #ifndef RCT_REMOVE_LEGACY_ARCH):
      #
      #     #if USE_THIRD_PARTY_JSC != 1
      #       return std::make_unique<HermesExecutorFactory>(...);
      #     #endif
      #     // ← NO return here → empty non-void function → -Werror=return-type
      #
      #   When USE_THIRD_PARTY_JSC=1 the Hermes return is excluded and the
      #   function has no return path, causing:
      #     error: non-void function does not return a value [-Werror,-Wreturn-type]
      #     RCTAppSetupUtils.mm:155 and RCTAppSetupUtils.mm:179
      #
      # FIX:
      #   Add '#else return nullptr; #endif' to both USE_THIRD_PARTY_JSC blocks.
      #   The RN 0.83.2 source already returns nullptr in the RCT_REMOVE_LEGACY_ARCH
      #   branch with the comment "This method should not be invoked in the New Arch."
      #   Since RCT_NEW_ARCH_ENABLED=1 these functions are never called at runtime;
      #   nullptr only satisfies -Werror=return-type at compile time.
      #
      #   RESULT:
      #     #if USE_THIRD_PARTY_JSC != 1
      #       return std::make_unique<HermesExecutorFactory>(...);
      #     #else
      #       return nullptr; // jsc-nullptr-fallback
      #     #endif
      #
      # IDEMPOTENCY: sentinel 'jsc-nullptr-fallback' — skip if already patched.
      # SCOPE: node_modules only — transient, never committed.
      # -------------------------------------------------------------------------
      - name: Patch RCTAppSetupUtils.mm — add nullptr return for JSC+NewArch path
        shell: bash
        run: |
          set -euo pipefail

          MM=$(find node_modules -path "*/Libraries/AppDelegate/RCTAppSetupUtils.mm" \
               -not -path "*/node_modules/*/node_modules/*" 2>/dev/null | head -1)

          if [ -z "$MM" ]; then
            echo "FAIL: RCTAppSetupUtils.mm not found in node_modules"
            exit 1
          fi
          echo "Found: $MM"

          if grep -qF 'jsc-nullptr-fallback' "$MM"; then
            echo "Already patched — skipping."
          else
            echo "--- BEFORE patch (lines 146-154 and 170-178) ---"
            sed -n '146,155p' "$MM"
            echo "---"
            sed -n '170,179p' "$MM"

            python3 - "$MM" <<'PYEOF'
          import sys

          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()

          OLD = (
              '#if USE_THIRD_PARTY_JSC != 1\n'
              '  return std::make_unique<facebook::react::HermesExecutorFactory>(\n'
              '      facebook::react::RCTJSIExecutorRuntimeInstaller(runtimeInstallerLambda));\n'
              '#endif'
          )
          NEW = (
              '#if USE_THIRD_PARTY_JSC != 1\n'
              '  return std::make_unique<facebook::react::HermesExecutorFactory>(\n'
              '      facebook::react::RCTJSIExecutorRuntimeInstaller(runtimeInstallerLambda));\n'
              '#else\n'
              '  return nullptr; // jsc-nullptr-fallback\n'
              '#endif'
          )

