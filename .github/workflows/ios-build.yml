              print("Actual lines 44-55:")
              for i, line in enumerate(content.split('\n')[43:55], 44):
                  print(f"  {i}: {repr(line)}")
              sys.exit(1)

          content = content.replace(old, new, 1)

          with open(path, 'w') as f:
              f.write(content)

          print("Patch applied.")
          PYEOF

            echo ""
            echo "--- AFTER patch (lines 44-56) ---"
            sed -n '44,56p' "$MM"
          fi

          echo ""
          echo "=== Validation ==="

          # 1. NULL fallback present
          if grep -qF 'return NULL; // jsc-null-fallback' "$MM"; then
            echo "PASS: 'return NULL; // jsc-null-fallback' present"
          else
            echo "FAIL: NULL fallback not found"
            exit 1
          fi

          # 2. Hermes return still present (guarded)
          if grep -qF 'return jsrt_create_hermes_factory();' "$MM"; then
            echo "PASS: Hermes return still present (guarded by #if)"
          else
            echo "FAIL: Hermes return was accidentally removed"
            exit 1
          fi

          echo "OK: RCTDefaultReactNativeFactoryDelegate.mm patched — NULL return added for JSC path"

      # -------------------------------------------------------------------------
      # 5a-v. Patch ios/AppDelegate.swift (transient): wire JSC runtime factory
      #
      # ROOT CAUSE (Build 8 / Build 9):
      #   error: non-void function does not return a value [-Werror,-Wreturn-type]
      #   File: Libraries/AppDelegate/RCTDefaultReactNativeFactoryDelegate.mm
      #   Method: -createJSRuntimeFactory
      #
      # React Native 0.83.2's createJSRuntimeFactory in RCTDefaultReactNativeFactory
      # Delegate.mm has only a Hermes-guarded return, no JSC path:
      #
      #   - (JSRuntimeFactoryRef)createJSRuntimeFactory
      #   {
      #   #if USE_THIRD_PARTY_JSC != 1
      #     return jsrt_create_hermes_factory();
      #   #endif
      #   }                    ← empty when USE_THIRD_PARTY_JSC=1 → -Werror fires
      #                          (fixed by Step 5a-vi above)
      #
      # CORRECT FIX — per @react-native-community/javascriptcore 0.2.0 README:
      #   The documented integration is to override createJSRuntimeFactory in the
      #   APPLICATION's AppDelegate, NOT to patch React Native's own delegate.
      #
      #   Patching RCTDefaultReactNativeFactoryDelegate.mm (as v19 attempted) is
      #   wrong because React-RCTAppDelegate does NOT have React-jsc in its pod
      #   dependencies, so the ReactJSC module is unavailable when that file
      #   compiles → 'ReactJSC/RCTJscInstanceFactory.h' file not found (Build 9).
      #
      # WHY AppDelegate.swift IS THE RIGHT TARGET:
      #   - ReactJSC is a dependency of the APPLICATION target (via React-jsc pod).
      #   - AppDelegate.swift compiles in the application target → has full access
      #     to all pod headers including ReactJSC.
      #   - The Swift override shadow-overrides the broken Obj-C base implementation
      #     so it is called instead. Step 5a-vi ensures the base still compiles.
      #
      # GENERATED STRUCTURE (expo prebuild --clean):
      #   // ios/MedAcademy/AppDelegate.swift
      #   internal import Expo
      #   import React
      #   import ReactAppDependencyProvider
      #   @main
      #   class AppDelegate: ExpoAppDelegate { ... }
      #
      #   class ReactNativeDelegate: ExpoReactNativeFactoryDelegate {
      #     override func sourceURL(for bridge: RCTBridge) -> URL? { ... }
      #     override func bundleURL() -> URL? { ... }
      #   }           ← INJECT override func createJSRuntimeFactory BEFORE this '}'
      #
      # TWO CHANGES to AppDelegate.swift:
      #
      # CHANGE 1 — add 'import ReactJSC' after existing imports.
      #   BEFORE:
      #     internal import Expo
      #     import React
      #     import ReactAppDependencyProvider
      #   AFTER:
      #     internal import Expo
      #     import React
      #     import ReactAppDependencyProvider
      #     import ReactJSC
      #
      # CHANGE 2 — inject override inside ReactNativeDelegate class, before
      #   its closing '}':
      #     override func createJSRuntimeFactory() -> UnsafeMutableRawPointer {
      #       return jsrt_create_jsc_factory()
      #     }
      #
      # IDEMPOTENCY:
      #   Sentinel = 'import ReactJSC' already present → skip both changes.
      #
      # WHY NO HEADER SEARCH PATH CHANGE IS NEEDED:
      #   React-jsc.podspec declares module_name = "ReactJSC" and DEFINES_MODULE=YES.
      #   CocoaPods generates a Swift-importable module at:
      #     Pods/Headers/Public/ReactJSC/React-jsc.modulemap
      #   The application target automatically sees this module (all pod modules
      #   are in the module search path for the app target). No manual xcconfig
      #   change is required.
      #
      # PERMANENCE:
      #   ios/ is deleted and regenerated by expo prebuild --clean on every build.
      #   This patch is re-applied transiently in each CI run after prebuild and
      #   before pod install. The source-controlled file (.github/workflows/…) is
      #   the only permanent change.
      # -------------------------------------------------------------------------
      - name: Patch AppDelegate.swift — wire JSC runtime factory via ReactNativeDelegate override
        shell: bash
        run: |
          set -euo pipefail

          APPDELEGATE="ios/MedAcademy/AppDelegate.swift"

          if [ ! -f "$APPDELEGATE" ]; then
            echo "FAIL: $APPDELEGATE not found — expo prebuild must have run first"
            exit 1
          fi

          echo "--- AppDelegate.swift BEFORE patch ---"
          cat -n "$APPDELEGATE"

          python3 - "$APPDELEGATE" <<'PYEOF'
          import sys, re

          path = sys.argv[1]

          with open(path, 'r') as f:
              content = f.read()

          # ------------------------------------------------------------------
          # Idempotent sentinel: 'import ReactJSC' only exists after patching.
          # ------------------------------------------------------------------
          if 'import ReactJSC' in content:
              print("Already patched — skipping.")
              sys.exit(0)

          # ------------------------------------------------------------------
          # CHANGE 1: Insert 'import ReactJSC' after 'import ReactAppDependencyProvider'.
          # This exact line is present in every Expo-generated AppDelegate.swift.
          # ------------------------------------------------------------------
          anchor_import = 'import ReactAppDependencyProvider'
          if anchor_import not in content:
              print(f"ERROR: '{anchor_import}' not found in {path}")
              print("Actual imports:")
              for i, line in enumerate(content.split('\n')[:10], 1):
                  print(f"  {i}: {line}")
              sys.exit(1)

          content = content.replace(
              anchor_import,
              anchor_import + '\nimport ReactJSC',
              1
          )

          # ------------------------------------------------------------------
          # CHANGE 2: Inject createJSRuntimeFactory override into ReactNativeDelegate.
          #
          # Strategy: find the class ReactNativeDelegate block, then find the
          # very last '}' that belongs to it (the class-closing brace). We do
          # this by scanning lines after the class declaration and tracking
          # brace depth — the class closes when depth returns to 0.
          # Inject the override method before that closing brace.
          # ------------------------------------------------------------------
          class_marker = 'class ReactNativeDelegate:'
          lines = content.split('\n')

          class_start = None
          for i, line in enumerate(lines):
              if class_marker in line:
                  class_start = i
                  break

          if class_start is None:
              print(f"ERROR: '{class_marker}' not found in {path}")
              sys.exit(1)

          print(f"Found ReactNativeDelegate class at line {class_start + 1}")

          # Walk from class_start, track brace depth to find class-closing '}'
          depth = 0
          class_close = None
          for i in range(class_start, len(lines)):
              depth += lines[i].count('{') - lines[i].count('}')
              if depth <= 0 and i > class_start:
                  class_close = i
                  break

          if class_close is None:
              print("ERROR: Could not find closing '}' of ReactNativeDelegate class")
              sys.exit(1)

          print(f"ReactNativeDelegate class closes at line {class_close + 1}")

          # Build the method to inject (2-space indent matches generated style).
          # Return type is UnsafeMutableRawPointer — the Swift bridging of
          # JSRuntimeFactoryRef (typedef void*) from RCTJSRuntimeConfiguratorProtocol.h.
          # 'JSRuntimeFactory' is a C++ class, not a Swift type; using it causes
          #   error: cannot find type 'JSRuntimeFactory' in scope
          override_method = (
              '\n'
              '  override func createJSRuntimeFactory() -> UnsafeMutableRawPointer {\n'
              '    return jsrt_create_jsc_factory()\n'
              '  }\n'
          )

          # Insert the override before the class-closing brace
          new_lines = lines[:class_close] + override_method.split('\n') + lines[class_close:]
          # The split('\n') of override_method produces ['', '  override...', ...', '']
          # which adds a blank line before and after — clean and idiomatic Swift
          content = '\n'.join(new_lines)

          with open(path, 'w') as f:
              f.write(content)

          print("Patch applied successfully.")
          PYEOF

          echo ""
          echo "--- AppDelegate.swift AFTER patch ---"
          cat -n "$APPDELEGATE"

          echo ""
          echo "=== Validation ==="

          # 1. import ReactJSC present exactly once
          COUNT=$(grep -c 'import ReactJSC' "$APPDELEGATE" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: 'import ReactJSC' appears $COUNT times (expected 1)"
            exit 1
          fi
          echo "PASS: 'import ReactJSC' appears exactly once"

          # 2. createJSRuntimeFactory present exactly once
          COUNT=$(grep -c 'createJSRuntimeFactory' "$APPDELEGATE" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: 'createJSRuntimeFactory' appears $COUNT times (expected 1)"
            exit 1
          fi
          echo "PASS: 'createJSRuntimeFactory' appears exactly once"

          # 3. jsrt_create_jsc_factory() call present
          if ! grep -qF 'jsrt_create_jsc_factory()' "$APPDELEGATE"; then
            echo "FAIL: 'jsrt_create_jsc_factory()' not found"
            exit 1
          fi
          echo "PASS: 'jsrt_create_jsc_factory()' present"

          # 4. RCTDefaultReactNativeFactoryDelegate.mm must NOT contain ReactJSC
          MM=$(find node_modules -path "*/Libraries/AppDelegate/RCTDefaultReactNativeFactoryDelegate.mm" \
               -not -path "*/node_modules/*/node_modules/*" 2>/dev/null | head -1)
          if grep -qF 'ReactJSC' "$MM" 2>/dev/null; then
            echo "FAIL: RCTDefaultReactNativeFactoryDelegate.mm was modified (contains ReactJSC) — must not be touched"
            exit 1
          fi
          echo "PASS: RCTDefaultReactNativeFactoryDelegate.mm is unmodified"

          echo "OK: AppDelegate.swift patched — createJSRuntimeFactory wired to jsrt_create_jsc_factory()"

      # -------------------------------------------------------------------------
      # 5b. CocoaPods install
      #
      # USE_THIRD_PARTY_JSC=1 tells jsengine.rb's use_third_party_jsc() to return
      # true, which — after the patch above — prevents setup_hermes! from running
      # and prevents setup_bridgeless! from adding React-RuntimeHermes.
      # All other RN podspecs that guard on use_hermes() already work correctly
      # because use_hermes() = !use_third_party_jsc() in jsengine.rb.
      #
      # USE_HERMES=0 additionally satisfies ExpoModulesCore.podspec and
      # ExpoModulesJSI.podspec, which check ENV['USE_HERMES'] directly (not
      # USE_THIRD_PARTY_JSC) to decide whether to add hermes-engine as a dep.
      #
      # node_modules/ is NOT ios/ — patching it here does not permanently modify
      # ios/ and does not affect expo prebuild --clean on the next run.
      # -------------------------------------------------------------------------
      - name: CocoaPods install
        working-directory: ios
        env:
          USE_THIRD_PARTY_JSC: "1"
          USE_HERMES: "0"
        shell: bash
        run: |
          set -euo pipefail

          echo "USE_THIRD_PARTY_JSC=${USE_THIRD_PARTY_JSC}"
          echo "USE_HERMES=${USE_HERMES}"

          echo "Running pod install..."
          pod install --repo-update 2>&1 | tee /tmp/pod-install.log
          POD_STATUS=${PIPESTATUS[0]}

          if [ "$POD_STATUS" -ne 0 ]; then
            echo "FAIL: pod install failed (exit $POD_STATUS)"
            tail -100 /tmp/pod-install.log || true
            exit "$POD_STATUS"
          fi

          echo "OK: pod install succeeded"

          if [ ! -d "Pods" ]; then
            echo "FAIL: Pods/ directory was not created"
            exit 1
          fi
          echo "OK: Pods/ directory present"

          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "FAIL: No .xcworkspace found after pod install"
            exit 1
          fi
          echo "OK: Xcode workspace present: $WORKSPACE"

          # ── Hard gate: hermes-engine pod must NOT be installed ────────────────
          if [ -d "Pods/hermes-engine" ]; then
            echo "FAIL: Pods/hermes-engine/ is present after pod install."
            echo "      The react_native_pods.rb patch (step 5a) may not have applied."
            echo ""
            echo "--- Diagnostics ---"
            echo "USE_THIRD_PARTY_JSC : ${USE_THIRD_PARTY_JSC}"
            echo "USE_HERMES          : ${USE_HERMES}"
            echo "expo.jsEngine from Podfile.properties.json:"
            python3 -c "import json; d=json.load(open('Podfile.properties.json')); print(d.get('expo.jsEngine','(not set)'))"
            echo "react_native_pods.rb hermes lines:"
            grep -n "if hermes_enabled\|setup_bridgeless" \
              "../node_modules/react-native/scripts/react_native_pods.rb" || true
            echo "React Native version:"
            python3 -c "import json; d=json.load(open('../node_modules/react-native/package.json')); print(d.get('version','unknown'))" 2>/dev/null || echo "(unknown)"
            echo "Expo SDK version:"
            python3 -c "import json; d=json.load(open('../node_modules/expo/package.json')); print(d.get('version','unknown'))" 2>/dev/null || echo "(unknown)"
            echo "---"
            ls -la "Pods/hermes-engine/" | head -10
            exit 1
          fi
          echo "OK: Pods/hermes-engine is absent — JSC engine confirmed"

      # -------------------------------------------------------------------------
      # 5b. Patch fmt 11.0.2 for Apple Clang 21 (Xcode 26) consteval bug
      #
      # fmt 11.0.2 enables FMT_USE_CONSTEVAL for Apple Clang >= threshold that
      # includes Clang 21. Xcode 26 / Apple Clang 21 applies stricter consteval
      # rules and rejects fmt's FMT_STRING() calls in format-inl.h:
      #
      #   error: call to consteval function ... is not a constant expression
      #
      # Fix: force FMT_USE_CONSTEVAL 0 inside fmt/base.h AFTER pod install.
      # Patching base.h (not a compiler flag) is required because fmt/base.h
      # re-evaluates and overrides a bare -DFMT_USE_CONSTEVAL=0.
      #
      # ios/Podfile is regenerated by expo prebuild --clean on every run,
      # so this patch MUST live here in the workflow, not in the Podfile.
      #
      # The patch is idempotent (guarded by a sentinel comment).
      # -------------------------------------------------------------------------
      - name: Patch fmt consteval for Apple Clang 21 (Xcode 26)
        shell: bash
        run: |
          BASE_H="ios/Pods/fmt/include/fmt/base.h"
          SENTINEL="FMT_USE_CONSTEVAL_PATCHED_FOR_APPLE_CLANG_21"

          echo "=== fmt version from Podfile.lock ==="
          grep -i " fmt " ios/Podfile.lock 2>/dev/null \
            || grep -i " fmt " ios/Pods/Manifest.lock 2>/dev/null \
            || echo "(fmt version not found in lock files)"

          if [ ! -f "$BASE_H" ]; then
            echo "INFO: $BASE_H not found -- fmt not installed, skipping patch"
            exit 0
          fi

          echo "=== FMT_USE_CONSTEVAL lines before patch ==="
          grep -n "FMT_USE_CONSTEVAL" "$BASE_H" || true

          if grep -q "$SENTINEL" "$BASE_H"; then
            echo "OK: Patch already applied (sentinel found) -- skipping (idempotent)"
            exit 0
          fi

          PATCH_BLOCK='// FMT_USE_CONSTEVAL_PATCHED_FOR_APPLE_CLANG_21\n// Force-disable consteval for Apple Clang 21 (Xcode 26)\n#if defined(__apple_build_version__) && __apple_build_version__ >= 21000000\n#  undef  FMT_USE_CONSTEVAL\n#  define FMT_USE_CONSTEVAL 0\n#endif'

          # Make fmt/base.h writable before patching.
          # CocoaPods installs headers read-only; Python open(path,'w') raises
          # PermissionError: [Errno 13] Permission denied without this step.
          echo "=== File permissions before chmod ==="
          ls -la "$BASE_H"
          chmod u+w "$BASE_H"
          if [ ! -w "$BASE_H" ]; then
            echo "FAIL: $BASE_H is not writable after chmod u+w -- cannot patch"
            exit 1
          fi
          echo "OK: $BASE_H is writable"

          # Decode the base64-encoded Python patcher -- no heredoc needed,
          # 100% YAML-safe since the encoded string is a single quoted scalar.
          PATCHER=$(mktemp /tmp/fmt_patch_XXXXXX.py)
          echo '' | base64 --decode > "$PATCHER"

          python3 "$PATCHER" "$BASE_H" "$PATCH_BLOCK"
          PY_EXIT=$?
          rm -f "$PATCHER"

          if [ $PY_EXIT -ne 0 ]; then
            echo "WARN: patcher exited $PY_EXIT"
          fi

          echo ""
          echo "=== FMT_USE_CONSTEVAL lines after patch ==="
          grep -n "FMT_USE_CONSTEVAL" "$BASE_H" || true

          if grep -q "$SENTINEL" "$BASE_H"; then
            echo "OK: Patch confirmed applied"
          else
            echo "WARN: Sentinel not found after patch attempt"
          fi

      - name: Discover Xcode workspace and scheme
        id: xcode-info
        shell: bash
        run: |
          # ------------------------------------------------------------------
          # Step 1: Find the top-level CocoaPods workspace directly under ios/
          # (maxdepth 1 so we never pick up ios/*.xcodeproj/project.xcworkspace)
          # ------------------------------------------------------------------
          WORKSPACE=$(find ios -maxdepth 1 -type d -name "*.xcworkspace" | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "FAIL: No top-level .xcworkspace found directly under ios/"
            echo "      (CocoaPods must generate ios/<Name>.xcworkspace after pod install)"
            echo ""
            echo "All .xcworkspace paths found (for diagnosis):"
            find ios -maxdepth 3 -type d -name "*.xcworkspace" -print
            echo ""
            echo "All .xcodeproj paths found (for diagnosis):"
            find ios -maxdepth 2 -name "*.xcodeproj" -print
            exit 1
          fi

          echo "=== Selected workspace ==="
          echo "$WORKSPACE"

          # ------------------------------------------------------------------
          # Step 2: List all available schemes in the workspace
          # ------------------------------------------------------------------
          echo ""
          echo "=== Available schemes ==="
          SCHEMES_OUTPUT=$(xcodebuild -workspace "$WORKSPACE" -list 2>&1)
          echo "$SCHEMES_OUTPUT"

          # ------------------------------------------------------------------
          # Step 3: Determine the correct application scheme.
          # Priority order:
          #   a) A scheme whose name exactly matches the workspace basename
          #      (e.g. workspace = ios/MedAcademy.xcworkspace -> try "MedAcademy")
          #   b) The first scheme listed that is NOT "Pods" and NOT a test scheme
          # ------------------------------------------------------------------
          WORKSPACE_BASENAME=$(basename "$WORKSPACE" .xcworkspace)

          # Extract scheme names from xcodebuild -list output
          # Schemes appear after the "Schemes:" line, one per indented line
          ALL_SCHEMES=$(echo "$SCHEMES_OUTPUT" \
            | awk '/Schemes:/{found=1; next} found && /^[[:space:]]+[^[:space:]]/{print $1}')

          echo ""
          echo "Parsed scheme list:"
          echo "$ALL_SCHEMES"

          # a) Try exact match on workspace basename
          SCHEME=""
          if echo "$ALL_SCHEMES" | grep -qx "$WORKSPACE_BASENAME"; then
            SCHEME="$WORKSPACE_BASENAME"
            echo "Selected scheme (exact match): $SCHEME"
          fi

          # b) Fall back: first scheme that is not "Pods" and not a *Tests scheme
          if [ -z "$SCHEME" ]; then
            SCHEME=$(echo "$ALL_SCHEMES" \
              | grep -v "^Pods$" \
              | grep -v "Tests$" \
              | head -1)
            if [ -n "$SCHEME" ]; then
              echo "Selected scheme (first non-Pods/non-Tests): $SCHEME"
            fi
          fi

          if [ -z "$SCHEME" ]; then
            echo "FAIL: Could not determine a valid application scheme."
            echo "      Available schemes:"
            echo "$ALL_SCHEMES"
            exit 1
          fi

          # ------------------------------------------------------------------
          # Step 4: Hard-validate that the selected scheme actually exists
          # ------------------------------------------------------------------
          if ! echo "$ALL_SCHEMES" | grep -qx "$SCHEME"; then
            echo "FAIL: Selected scheme '$SCHEME' is not in the workspace scheme list."
            echo "      Available schemes:"
            echo "$ALL_SCHEMES"
            exit 1
          fi

          echo ""
          echo "=== Selected scheme ==="
          echo "$SCHEME"

          # ------------------------------------------------------------------
          # Step 5: Export outputs
          # ------------------------------------------------------------------
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # 7. xcodebuild (unsigned, Release)
      # CODE_SIGNING_ALLOWED=NO gives a compiled binary packageable as unsigned IPA.
      # PIPESTATUS[0] captures xcodebuild's real exit code from the tee pipeline.
      # Complete compiler diagnostics printed on failure (no tail truncation).
      # -------------------------------------------------------------------------
      - name: Build iOS app (unsigned, Release)
        id: xcode-build
        shell: bash
        run: |
          WORKSPACE="${{ steps.xcode-info.outputs.workspace }}"
          SCHEME="${{ steps.xcode-info.outputs.scheme }}"
          BUILD_DIR="$RUNNER_TEMP/ios-build"

          echo "Building workspace: $WORKSPACE"
          echo "Scheme:             $SCHEME"
          echo "Build dir:          $BUILD_DIR"

          # ------------------------------------------------------------------
          # Tool versions (for diagnosis)
          # ------------------------------------------------------------------
          echo ""
          echo "=== Tool versions ==="
          xcodebuild -version
          clang --version
          ruby --version
          pod --version

          # fmt version from CocoaPods lock file
          echo ""
          echo "=== fmt version ==="
          grep -i "fmt" ios/Podfile.lock 2>/dev/null \
            || grep -i "fmt" ios/Pods/Manifest.lock 2>/dev/null \
            || echo "(fmt not found in lock files)"

          # ------------------------------------------------------------------
          # Build
          # ------------------------------------------------------------------
          echo ""
          echo "=== Starting xcodebuild ==="
          set -o pipefail

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ENABLE_BITCODE=NO \
            GCC_OPTIMIZATION_LEVEL=0 \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            USE_HERMES=false \
            build \
            2>&1 | tee /tmp/xcodebuild.log

          BUILD_EXIT=${PIPESTATUS[0]}

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "================================================================"
            echo "BUILD FAILED (exit $BUILD_EXIT) -- compiler diagnostics below"
            echo "================================================================"

            echo ""
            echo "=== COMPILER ERRORS (error: / fatal error: / clang: error: / FAILED) ==="
            grep -n -E "error:|fatal error:|clang: error:|: FAILED$" /tmp/xcodebuild.log \
              | tail -150 || true

            echo ""
            echo "=== fmt COMPILATION CONTEXT (format.cc +/-50 lines) ==="
            grep -n -B 30 -A 50 "Pods/fmt/src/format.cc" /tmp/xcodebuild.log \
              | tail -300 || true

            echo ""
            echo "=== Folly / React Native C++ CONTEXT ==="
            grep -n -E "Folly|RCT|folly|hermes" /tmp/xcodebuild.log \
              | grep -E "error:|fatal error:" | tail -50 || true

            echo ""
            echo "=== LAST 300 LINES of build log ==="
            tail -300 /tmp/xcodebuild.log

            exit "$BUILD_EXIT"
          fi

          echo "OK: xcodebuild succeeded"
          echo "build_dir=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # 8. Locate built .app bundle
      # xcodebuild places the .app at:
      #   <derivedDataPath>/Build/Products/Release-iphoneos/<Name>.app
      # -------------------------------------------------------------------------
      - name: Locate built .app bundle
        id: locate-app
        shell: bash
        run: |
          BUILD_DIR="${{ steps.xcode-build.outputs.build_dir }}"

          echo "Searching for .app in: $BUILD_DIR"
          APP_PATH=$(find "$BUILD_DIR/Build/Products" \
            -name "*.app" \
            -not -name "*.app.dSYM" \
            -maxdepth 3 \
            -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "FAIL: No .app bundle found under $BUILD_DIR/Build/Products"
            echo "Contents of Build/Products:"
            find "$BUILD_DIR/Build/Products" -maxdepth 3 | head -40 || echo "(empty)"
            exit 1
          fi
          echo "OK: Found .app at: $APP_PATH"

          APP_NAME=$(basename "$APP_PATH" .app)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # 9. Validate .app bundle integrity
      # -------------------------------------------------------------------------
      - name: Validate .app bundle integrity
        shell: bash
        run: |
          APP_PATH="${{ steps.locate-app.outputs.app_path }}"
          APP_NAME="${{ steps.locate-app.outputs.app_name }}"

          echo "=== Validating: $APP_PATH ==="

          if [ ! -d "$APP_PATH" ]; then
            echo "FAIL: $APP_PATH is not a directory"
            exit 1
          fi
          echo "OK: .app is a directory"

          EXEC_PATH="$APP_PATH/$APP_NAME"
          if [ ! -f "$EXEC_PATH" ]; then
            echo "FAIL: Executable not found at: $EXEC_PATH"
            ls -la "$APP_PATH" | head -30
            exit 1
          fi
          EXEC_SIZE=$(stat -f%z "$EXEC_PATH" 2>/dev/null || stat -c%s "$EXEC_PATH")
          echo "OK: Executable found: $EXEC_PATH ($EXEC_SIZE bytes)"

          # ── Mach-O binary format check ──────────────────────────────────────
          # Verify the executable is a real Mach-O binary (not a stub, script,
          # or empty placeholder) by inspecting the file type reported by `file`.
          FILE_TYPE=$(file "$EXEC_PATH")
          echo "    file(1) output: $FILE_TYPE"
          if ! echo "$FILE_TYPE" | grep -qiE "Mach-O"; then
            echo "FAIL: Executable is not a Mach-O binary -- incomplete or corrupt build"
            echo "      Expected 'Mach-O' in file(1) output, got: $FILE_TYPE"
            exit 1
          fi
          echo "OK: Executable is a valid Mach-O binary"

          # ── Architecture check (arm64 required for iOS device builds) ───────
          # lipo -info prints the architecture list for the binary.
          # A Release-iphoneos build must contain arm64.
          LIPO_INFO=$(lipo -info "$EXEC_PATH" 2>&1)
          echo "    lipo -info output: $LIPO_INFO"
          if ! echo "$LIPO_INFO" | grep -q "arm64"; then
            echo "FAIL: arm64 slice not found in executable -- wrong SDK or incomplete build"
            echo "      lipo -info reported: $LIPO_INFO"
            exit 1
          fi
          echo "OK: arm64 architecture confirmed"

          PLIST="$APP_PATH/Info.plist"
          if [ ! -f "$PLIST" ]; then
            echo "FAIL: Info.plist not found in .app"
            exit 1
          fi
          BUNDLE_ID=$(plutil -extract CFBundleIdentifier raw "$PLIST" 2>/dev/null || true)
          BUNDLE_VER=$(plutil -extract CFBundleShortVersionString raw "$PLIST" 2>/dev/null || true)
          echo "OK: Info.plist present"
          echo "    CFBundleIdentifier:         $BUNDLE_ID"
          echo "    CFBundleShortVersionString: $BUNDLE_VER"

          if [ -z "$BUNDLE_ID" ]; then
            echo "FAIL: CFBundleIdentifier is empty -- corrupted Info.plist or wrong build"
            exit 1
          fi
          echo "OK: Bundle ID confirmed: $BUNDLE_ID"

          if [ -d "$APP_PATH/Frameworks" ]; then
            FW_COUNT=$(find "$APP_PATH/Frameworks" -name "*.framework" -maxdepth 1 | wc -l | tr -d ' ')
            echo "OK: Frameworks/ present with $FW_COUNT framework(s)"
          else
            echo "WARN: No Frameworks/ directory (may be OK for fully-static build)"
          fi

          echo "--- .app bundle summary ---"
          du -sh "$APP_PATH"
          ls -la "$APP_PATH" | head -20

      # -------------------------------------------------------------------------
      # 10. Package into unsigned IPA
      # Standard IPA structure: a ZIP archive containing Payload/<AppName>.app/
      # -------------------------------------------------------------------------
      - name: Create unsigned IPA
        id: create-ipa
        shell: bash
        run: |
          APP_PATH="${{ steps.locate-app.outputs.app_path }}"
          APP_NAME="${{ steps.locate-app.outputs.app_name }}"
          IPA_DIR="$RUNNER_TEMP/ipa-staging"
          IPA_PATH="$RUNNER_TEMP/${APP_NAME}-unsigned.ipa"

          echo "=== Creating unsigned IPA ==="
          echo "Source .app: $APP_PATH"
          echo "Output IPA:  $IPA_PATH"

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"

          # Copy entire .app into Payload/ preserving symlinks
          cp -a "$APP_PATH" "$IPA_DIR/Payload/${APP_NAME}.app"
          echo "OK: Payload/ directory created"
          ls -la "$IPA_DIR/Payload/"

          cd "$IPA_DIR"
          zip -r "$IPA_PATH" Payload/ --symlinks
          ZIP_EXIT=$?
          if [ "$ZIP_EXIT" -ne 0 ]; then
            echo "FAIL: zip failed (exit $ZIP_EXIT)"
            exit "$ZIP_EXIT"
          fi
          echo "OK: zip completed successfully"

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------
      # 11. Validate IPA -- hard gate before upload
      # Fails the workflow if IPA is not a real archive >= 10 MB.
      # -------------------------------------------------------------------------
      - name: Validate IPA (hard gate before upload)
        shell: bash
        run: |
          IPA_PATH="${{ steps.create-ipa.outputs.ipa_path }}"
          APP_NAME="${{ steps.create-ipa.outputs.app_name }}"

          echo "=== IPA Validation ==="
          echo "Path: $IPA_PATH"

          if [ ! -f "$IPA_PATH" ]; then
            echo "FAIL: IPA file does not exist at: $IPA_PATH"
            exit 1
          fi
          echo "OK: IPA file exists"

          if ! unzip -t "$IPA_PATH" > /dev/null 2>&1; then
            echo "FAIL: IPA is NOT a valid ZIP archive"
            file "$IPA_PATH"
            hexdump -C "$IPA_PATH" | head -4
            exit 1
          fi
          echo "OK: IPA is a valid ZIP archive"

          if ! unzip -l "$IPA_PATH" | grep -q "Payload/${APP_NAME}.app/"; then
            echo "FAIL: IPA does not contain Payload/${APP_NAME}.app/"
            echo "--- IPA contents (first 30 entries) ---"
            unzip -l "$IPA_PATH" | head -30
            exit 1
          fi
          echo "OK: IPA contains Payload/${APP_NAME}.app/"

          if unzip -l "$IPA_PATH" | grep -q "Payload/${APP_NAME}.app/${APP_NAME}$"; then
            echo "OK: Executable present in IPA"
          else
            echo "WARN: Executable not listed by exact name -- may still be valid"
          fi

          # Hard size gate: must be >= 10 MB
          IPA_SIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")
          IPA_SIZE_MB=$(echo "scale=2; $IPA_SIZE / 1048576" | bc)
          echo "--- IPA size: $IPA_SIZE bytes (${IPA_SIZE_MB} MB) ---"

          MIN_BYTES=10485760
          if [ "$IPA_SIZE" -lt "$MIN_BYTES" ]; then
            echo "FAIL: IPA is too small: $IPA_SIZE bytes (${IPA_SIZE_MB} MB) -- must be >= 10 MB"
            echo "      This indicates a broken build, wrong path, placeholder, or empty archive."
            echo "--- IPA contents ---"
            unzip -l "$IPA_PATH" | head -40
            exit 1
          fi
          echo "OK: IPA size is acceptable: $IPA_SIZE bytes (${IPA_SIZE_MB} MB)"

          echo "--- IPA contents (first 40 entries) ---"
          unzip -l "$IPA_PATH" | head -40

          # ── Hard gate: hermesvm.framework must NOT be in the IPA ─────────────
          # hermesvm.framework is embedded under Payload/<App>.app/Frameworks/
          # If it is present, the iOS JS engine is still Hermes and the app will
          # crash on iOS 26 with EXC_BAD_ACCESS in HadesGC / ObjCTurboModule.
          # This is the final binary-level confirmation that JSC is active.
          if unzip -l "$IPA_PATH" | grep -q "hermesvm.framework"; then
            echo ""
            echo "================================================================"
            echo "FAIL: hermesvm.framework is present in the IPA."
            echo "      The iOS JS engine is still Hermes."
            echo "      withIosJsc plugin did not set hermes_enabled => false,"
            echo "      or hermesvm.framework was linked despite JSC configuration."
            echo "      Hermes entries found:"
            unzip -l "$IPA_PATH" | grep -i "hermes"
            echo "================================================================"
            exit 1
          fi
          echo "OK: hermesvm.framework is ABSENT from IPA — JSC engine confirmed"

          # ── Hard gate: no statically-linked Hermes symbols in main binary ────
          # hermesvm.framework can be ABSENT (passes the zip check above) yet
          # Hermes code can still execute when hermes-engine is linked as a
          # STATIC library — its symbols end up directly inside the app binary
          # rather than as a separate .framework.  In that case the app crashes
          # at runtime with hermes::vm::* backtraces despite the zip gate
          # passing (EXC_BAD_ACCESS / SIGSEGV during Map.set / GC rehash).
          #
          # This second gate uses `nm` to inspect the Mach-O binary for
          # hermes::vm:: symbols.  Any match means Hermes is statically linked
          # and the build must be rejected.
          #
          # nm flags:
          #   -a  include all symbols (debug + non-debug)
          #   -u  undefined symbols only is NOT what we want; we want DEFINED
          #       symbols inside this binary → use default (no -u)
          #   We pipe through grep for the hermes::vm:: namespace prefix,
          #   which is unique to the Hermes C++ runtime.
          APP_EXEC_PATH="${{ steps.locate-app.outputs.app_path }}/${{ steps.locate-app.outputs.app_name }}"
          echo "--- nm check for statically-linked hermes::vm:: symbols ---"
          echo "    binary: $APP_EXEC_PATH"
          if nm "$APP_EXEC_PATH" 2>/dev/null | grep -q "hermes::vm::"; then
            echo ""
            echo "================================================================"
            echo "FAIL: hermes::vm:: symbols found in main binary."
            echo "      Hermes is statically linked into the app executable."
            echo "      Even though hermesvm.framework is absent from the IPA,"
            echo "      Hermes will execute at runtime and cause:"
            echo "        EXC_BAD_ACCESS / SIGSEGV in hermes::vm::OrderedHashMap"
            echo "      (seen as a black screen crash on first launch)."
            echo ""
            echo "      This means the JSC patches did not fully prevent"
            echo "      hermes-engine from being linked.  Check:"
            echo "        1. react_native_pods.rb patch (use_third_party_jsc gate)"
            echo "        2. Podfile :hermes_enabled => false"
            echo "        3. USE_HERMES Xcode build setting"
            echo ""
            echo "      Matching hermes::vm symbols (first 20):"
            nm "$APP_EXEC_PATH" 2>/dev/null | grep "hermes::vm::" | head -20
            echo "================================================================"
            exit 1
          fi
          echo "OK: hermes::vm:: symbols ABSENT from binary — no static Hermes linkage"

          echo "OK: All IPA validations passed -- proceeding to upload"

      # -------------------------------------------------------------------------
      # 12. Upload IPA artifact
      # -------------------------------------------------------------------------
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MedAcademy-unsigned-IPA
          path: ${{ steps.create-ipa.outputs.ipa_path }}
          retention-days: 14
          if-no-files-found: error

      # -------------------------------------------------------------------------
      # 13. Upload build logs on failure
      # -------------------------------------------------------------------------
      - name: Upload Xcode build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            /tmp/xcodebuild.log
            /tmp/xcodebuild-raw.log
            /tmp/pod-install.log
          retention-days: 7
          if-no-files-found: ignore

      # -------------------------------------------------------------------------
      # 14. Build summary
      # -------------------------------------------------------------------------
      - name: Build summary
        if: success()
        shell: bash
        run: |
          IPA_PATH="${{ steps.create-ipa.outputs.ipa_path }}"
          APP_NAME="${{ steps.create-ipa.outputs.app_name }}"
          IPA_SIZE=$(stat -f%z "$IPA_PATH" 2>/dev/null || stat -c%s "$IPA_PATH")
          IPA_SIZE_MB=$(echo "scale=2; $IPA_SIZE / 1048576" | bc)
          echo "================================================"
          echo "iOS Build Completed Successfully"
          echo "App:      $APP_NAME"
          echo "IPA size: ${IPA_SIZE_MB} MB"
          echo "Artifact: MedAcademy-unsigned-IPA"
          echo "================================================"
