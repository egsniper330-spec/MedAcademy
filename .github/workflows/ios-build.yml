name: Build iOS Unsigned IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ios-build:
    name: Build iOS
    runs-on: macos-latest

    steps:
      # 1. Checkout latest project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Verify npm
      - name: Check Node and npm
        run: |
          node --version
          npm --version

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Generate iOS native project
      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      # 6. Install CocoaPods dependencies
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      # 7. Build unsigned iOS app
      - name: Build unsigned iOS
        run: |
          xcodebuild \
            -workspace ios/MedAcademy.xcworkspace \
            -scheme MedAcademy \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            | tee build.log

      # 8. Show build errors if the build failed
      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD ERRORS =========="
          grep -E "error:|ERROR|fatal error:" build.log | head -100 || true
          echo "========== END ERRORS =========="

      # 9. Locate generated .app
      - name: Find iOS app
        run: |
          echo "Searching for generated .app..."
          find build -name "*.app" -type d -print

      # 10. Package unsigned .app into IPA
      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was generated."
            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          zip -r MedAcademy-unsigned.ipa Payload

      # 11. Upload IPA
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MedAcademy-unsigned-IPA
          path: MedAcademy-unsigned.ipa
          retention-days: 7

      # 12. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: build.log
          retention-days: 7
